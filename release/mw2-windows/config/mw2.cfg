// =====================================================================
// MW2 (2009) MVP overlay for Red Eclipse
// Loaded from autoexec.cfg. Pure cvar/CubeScript layer — no C++ edits.
// =====================================================================

// ---- Parkour: OFF -----------------------------------------------------
// impulseaction gates jump-boost/launch; impulsemethod gates slide/wallrun.
// Setting both to 0 disables every IM_T_* multiplier branch in physics.cpp.
impulseaction 0
impulsemethod 0

// Belt-and-suspenders: zero the regen on every parkour impulse so even if
// an action slips through the gate, it costs everything and grants nothing.
impulsejumpregenmeter      0
impulseboostregenmeter     0
impulsedashregenmeter      0
impulseslideregenmeter     0
impulselaunchregenmeter    0
impulsemeleeregenmeter     0
impulsekickregenmeter      0
impulsegrabregenmeter      0
impulsewallrunregenmeter   0
impulsevaultregenmeter     0
impulsepoundregenmeter     0

// ---- Ground movement: slower, planted, MW2-ish ------------------------
movespeed       0.85    // overall scale; default 1.0 → ~15% slower
moverun         1.10    // default 1.25; trim the run cap
movesprint      1.40    // default 1.50; MW2 sprint is ~1.4× run
movestrafe      0.95    // default 1.10; punish side-strafe a bit
movestraight    1.10    // default 1.20; reduce forward-bias gap
moveinair       0.35    // default 0.75; MW2 has very low air control
movecrawl       0.55    // crouch speed
movesprintrotvel 4.0    // limit sprint turn rate (no 180° sprint snap)

// ---- Sprint stamina ---------------------------------------------------
// movesprintdecay > 0 → sprinttime drains; per-actor sprinttime caps total.
// Default actor sprinttime is engine-controlled; decay 1.0 → ~4 s sprint.
movesprintdecay 1.0

// ---- FOV --------------------------------------------------------------
firstpersonfov     80    // MW2 PC default ~80; console was 65
thirdpersonfov     90
firstpersondepthfov 65   // weapon model depth FOV — slight pull-in

// ---- ADS / hipfire spread skew ----------------------------------------
// Per-weapon spread tuning lives in weapons.h; these are the global
// modifiers we can reach. Goal: hipfire loose, ADS tight.
// (weapon-specific cookzoom* values stay at engine defaults for the MVP.)

// ---- TTK uplift -------------------------------------------------------
// global outgoing-damage multiplier; MW2 TTK is ~0.25 s with most ARs.
damagescale 1.40

// ---- Stairs / mantle (MW2 had no mantle slick, just chest-high climb) -
stairheight 4.1         // engine default; left explicit for clarity

// ---- Disable RE features that don't fit MW2 ---------------------------
showloadoutmenu 1       // we DO want a pre-spawn class picker

// ---- MW2 menu pack ----------------------------------------------------
// perks.cfg first — createaclass.cfg references the perk lists by name.
exec "config/ui/mw2/perks.cfg"
exec "config/ui/mw2/main.cfg"
exec "config/ui/mw2/barracks.cfg"
exec "config/ui/mw2/createaclass.cfg"

// Replace the default main-menu handler with the MW2 one.
gameui_panel_default = gameui_mw2_main_handler

echo "^f3[mw2]^f7 overlay loaded — parkour off, MW2 menu pack active."
