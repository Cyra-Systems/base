// =====================================================================
// MW2 main menu — replaces the default Red Eclipse main menu.
// Routes: MULTIPLAYER → offline maps, BARRACKS → MW2 barracks,
//         OPTIONS → settings, QUIT → confirm quit.
// =====================================================================

gameui_begin_ids

ui_gameui_mw2_main_dims = [0.42 0.62]

# ui_gameui_mw2_main = [
    uivlist 0.012 [

        // ---- Title block (stylised text, no logo image) ---------------
        uicolourtext "MODERN" 0xffeeb060 [
            uifont "default_outline"
        ]
        uicolourtext "WARFARE 2" 0xffffffff [
            uifont "default_outline"
        ]
        uifill 0 0.025

        // ---- MULTIPLAYER ---------------------------------------------
        ui_gameui_prettybutton [
            p_label    = "MULTIPLAYER"
            p_tip      = "Begin an offline match against bots"
            p_on_click = [
                gameui_open ui_gameui_maps
            ]
            p_id       = #(gameui_get_id prettybutton)
        ]

        // ---- BARRACKS (Create-a-Class, etc.) -------------------------
        ui_gameui_prettybutton [
            p_label    = "BARRACKS"
            p_tip      = "Loadouts, classes, and player setup"
            p_on_click = [
                gameui_open ui_gameui_mw2_barracks
            ]
            p_id       = #(gameui_get_id prettybutton)
        ]

        // ---- OPTIONS -------------------------------------------------
        ui_gameui_prettybutton [
            p_label    = "OPTIONS"
            p_tip      = "Graphics, sound, and gameplay settings"
            p_on_click = [
                gameui_open ui_gameui_settings
            ]
            p_id       = #(gameui_get_id prettybutton)
        ]

        if $isconnected [
            ui_gameui_prettybutton [
                p_label    = "LEAVE GAME"
                p_tip      = "Disconnect from the current match"
                p_on_click = [
                    gameui_confirm "Leave the current match?" [
                        disconnect
                    ]
                ]
                p_id       = #(gameui_get_id prettybutton)
            ]
        ]

        // ---- QUIT ----------------------------------------------------
        ui_gameui_prettybutton [
            p_label    = "QUIT"
            p_tip      = "Leave the game and return to desktop"
            p_on_click = [
                gameui_confirm "Quit Modern Warfare 2?" [
                    quit
                ]
            ]
            p_id       = #(gameui_get_id prettybutton)
        ]

        uifill 0 0.04

        ui_gameui_autoscrollh [
            uicolourtext (? $gameui_hovering $gameui_tip "") 0x88ffffff
        ] [
            p_width = $gameui_panel_new_size
        ]
    ]

    if $isconnected [
        #(ui_gameui_backbutton)
    ]
]

// Entry point: clear scoreboard, open the MW2 main panel.
gameui_mw2_main_handler = [
    togglescores 0
    gameui_open ui_gameui_mw2_main
]
