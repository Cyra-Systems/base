// =====================================================================
// MW2 Barracks — single-screen sub-menu.
// Currently exposes Create-a-Class and Player Setup; placeholders for
// Challenges, Leaderboards, and Theater so the screen feels like MW2.
// =====================================================================

ui_gameui_mw2_barracks_dims = [0.46 0.58]

# ui_gameui_mw2_barracks = [
    uivlist 0.012 [
        uicolourtext "BARRACKS" 0xffeeb060 [
            uifont "default_outline"
        ]
        uifill 0 0.02

        ui_gameui_prettybutton [
            p_label    = "CREATE A CLASS"
            p_tip      = "Edit your 5 custom loadouts"
            p_on_click = [
                gameui_open ui_gameui_mw2_createaclass
            ]
            p_id       = #(gameui_get_id prettybutton)
        ]

        ui_gameui_prettybutton [
            p_label    = "PLAYER SETUP"
            p_tip      = "Callsign, emblem, character model"
            p_on_click = [
                gameui_open ui_gameui_player
            ]
            p_id       = #(gameui_get_id prettybutton)
        ]

        ui_gameui_prettybutton [
            p_label    = "CHALLENGES"
            p_tip      = "[stub] Challenge progress goes here"
            p_on_click = []
            p_id       = #(gameui_get_id prettybutton)
        ]

        ui_gameui_prettybutton [
            p_label    = "LEADERBOARDS"
            p_tip      = "[stub] Leaderboards"
            p_on_click = []
            p_id       = #(gameui_get_id prettybutton)
        ]

        ui_gameui_prettybutton [
            p_label    = "THEATER"
            p_tip      = "[stub] Match replays — not in MVP"
            p_on_click = []
            p_id       = #(gameui_get_id prettybutton)
        ]

        uifill 0 0.04

        ui_gameui_autoscrollh [
            uicolourtext (? $gameui_hovering $gameui_tip "") 0x88ffffff
        ] [
            p_width = $gameui_panel_new_size
        ]
    ]

    #(ui_gameui_backbutton)
]
