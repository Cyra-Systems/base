// =====================================================================
// MW2 Create-a-Class — 5 class slots, each with primary/secondary,
// lethal/tactical, and three perk slots. Persisted to CubeScript
// aliases (mw2_class_<N>_<field>). No server protocol changes.
// =====================================================================

// ---- Slot data initialisation ----------------------------------------
// Each class slot stores 7 fields. Defaults mirror MW2's stock classes
// just closely enough that the menu reads like the real thing.

mw2_class_active = 1   // 1..5, which slot is currently selected

// Defaults are written once at exec time. Edits made through the menu
// persist for the session via CubeScript aliases. Cross-session save
// would require writing back to a .cfg — deferred past the MVP.
mw2_init_class = [
    alias (concatword "mw2_class_" $arg1 "_name")      $arg2
    alias (concatword "mw2_class_" $arg1 "_primary")   $arg3
    alias (concatword "mw2_class_" $arg1 "_secondary") $arg4
    alias (concatword "mw2_class_" $arg1 "_lethal")    $arg5
    alias (concatword "mw2_class_" $arg1 "_tactical")  $arg6
    alias (concatword "mw2_class_" $arg1 "_perk1")     $arg7
    alias (concatword "mw2_class_" $arg1 "_perk2")     $arg8
    alias (concatword "mw2_class_" $arg1 "_perk3")     $arg9
]

mw2_init_class 1 "Assault"     "Rifle"   "Pistol" "Frag"  "Flash" "Bling"           "Stopping Power" "Steady Aim"
mw2_init_class 2 "SMG Rusher"  "SMG"     "Pistol" "Semtex" "Stun" "Marathon"        "Lightweight"    "Commando"
mw2_init_class 3 "Sniper"      "Sniper"  "Pistol" "Claymore" "Smoke" "Sleight of Hand" "Cold-Blooded" "Ninja"
mw2_init_class 4 "LMG Support" "LMG"     "Pistol" "Frag"  "Smoke" "Scavenger"       "Hardline"       "Sit-Rep"
mw2_init_class 5 "Riot Shield" "Shield"  "Pistol" "Frag"  "Flash" "One Man Army"    "Danger Close"   "Last Stand"

// ---- Helpers ---------------------------------------------------------
mw2_class_get = [ getalias (concatword "mw2_class_" $arg1 "_" $arg2) ]
mw2_class_set = [ alias    (concatword "mw2_class_" $arg1 "_" $arg2) $arg3 ]

// Cycle through a list (used by the edit panel).
mw2_cycle = [
    // 1:list 2:current  -> returns next element
    local _list; _list = $arg1
    local _cur;  _cur  = $arg2
    local _i;    _i    = (indexof $_list $_cur)
    if (< $_i 0) [ at $_list 0 ] [
        at $_list (mod (+ $_i 1) (listlen $_list))
    ]
]

// Lists used by the edit panel pickers.
mw2_primary_list   = [ "Rifle" "SMG" "LMG" "Sniper" "Shotgun" "Shield" ]
mw2_secondary_list = [ "Pistol" "Machine Pistol" "Launcher" ]
mw2_lethal_list    = [ "Frag" "Semtex" "Throwing Knife" "Claymore" "C4" ]
mw2_tactical_list  = [ "Flash" "Stun" "Smoke" "Scrambler" "Tactical Insertion" ]

// ---- Create-a-Class screen: 5 slots ----------------------------------
ui_gameui_mw2_createaclass_dims = [0.56 0.66]

# ui_gameui_mw2_createaclass = [
    uivlist 0.01 [
        uicolourtext "CREATE A CLASS" 0xffeeb060 [
            uifont "default_outline"
        ]
        uifill 0 0.02

        loop n 5 [
            local _slot; _slot = (+ $n 1)
            ui_gameui_prettybutton [
                p_label    = (concatword "CLASS " $_slot "  ::  " (mw2_class_get $_slot "name"))
                p_tip      = (concatword "Edit Class " $_slot " — "
                                         (mw2_class_get $_slot "primary") " / "
                                         (mw2_class_get $_slot "secondary"))
                p_on_click = [
                    mw2_class_active = $_slot
                    gameui_open ui_gameui_mw2_classedit
                ]
                p_id       = #(gameui_get_id prettybutton)
            ]
        ]

        uifill 0 0.03

        ui_gameui_autoscrollh [
            uicolourtext (? $gameui_hovering $gameui_tip "") 0x88ffffff
        ] [
            p_width = $gameui_panel_new_size
        ]
    ]
    #(ui_gameui_backbutton)
]

// ---- Edit panel for the currently selected class slot ----------------
ui_gameui_mw2_classedit_dims = [0.58 0.7]

// Helper: render a "row" button that cycles a field.
mw2_edit_row = [
    // 1:label  2:field-name  3:list-alias
    local _lbl; _lbl = $arg1
    local _fld; _fld = $arg2
    local _lst; _lst = $arg3
    ui_gameui_prettybutton [
        p_label    = (concatword $_lbl "  ::  " (mw2_class_get $mw2_class_active $_fld))
        p_tip      = (concatword "Click to cycle " $_lbl)
        p_on_click = [
            mw2_class_set $mw2_class_active $_fld (mw2_cycle $$_lst (mw2_class_get $mw2_class_active $_fld))
        ]
        p_id       = #(gameui_get_id prettybutton)
    ]
]

# ui_gameui_mw2_classedit = [
    uivlist 0.008 [
        uicolourtext (concatword "CLASS " $mw2_class_active) 0xffeeb060 [
            uifont "default_outline"
        ]
        uicolourtext (mw2_class_get $mw2_class_active "name") 0xffffffff
        uifill 0 0.015

        mw2_edit_row "PRIMARY"   "primary"   "mw2_primary_list"
        mw2_edit_row "SECONDARY" "secondary" "mw2_secondary_list"
        mw2_edit_row "LETHAL"    "lethal"    "mw2_lethal_list"
        mw2_edit_row "TACTICAL"  "tactical"  "mw2_tactical_list"

        uifill 0 0.01
        mw2_edit_row "PERK 1"    "perk1"     "mw2_perk1_list"
        mw2_edit_row "PERK 2"    "perk2"     "mw2_perk2_list"
        mw2_edit_row "PERK 3"    "perk3"     "mw2_perk3_list"

        uifill 0 0.02

        ui_gameui_prettybutton [
            p_label    = "DONE"
            p_tip      = "Save and return to Create-a-Class"
            p_on_click = [
                gameui_back
            ]
            p_id       = #(gameui_get_id prettybutton)
        ]

        ui_gameui_autoscrollh [
            uicolourtext (? $gameui_hovering $gameui_tip "") 0x88ffffff
        ] [
            p_width = $gameui_panel_new_size
        ]
    ]
    #(ui_gameui_backbutton)
]
