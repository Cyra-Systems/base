// Multiplayer category sub-hub. Reachable from the main menu's
// "Multiplayer" tile. Routes to existing screens (online browser, maps
// for offline, player setup, team) so we don't duplicate their logic.

gameui_begin_ids

ui_gameui_multiplayer_dims = 0.7

# ui_gameui_multiplayer = [
    uivlist 0.018 [
        uistyle lefttop
        uistyle clampx

        uifill 0 0.04

        uicolour 0x55010101 0 0 [
            uistyle clampx

            ui_waw_title "Multiplayer"
            uispace 0 0.002
            ui_waw_subtitle "// Combat operations against players and bots"
            ui_gameui_shadowhoriz
        ]

        uifill 0 0.012

        uivlist 0.008 [
            uialign -1 -1

            ui_waw_categorytile [
                p_label    = "Find Match"
                p_sublabel = "Browse online servers and join a game"
                p_width    = 0.6
                p_on_click = [
                    gameui_open ui_gameui_online
                ]
                p_id       = #(gameui_get_id waw_categorytile)
            ]

            ui_waw_categorytile [
                p_label    = "Offline Match"
                p_sublabel = "Play any map against bots, no network needed"
                p_width    = 0.6
                p_on_click = [
                    gameui_open ui_gameui_maps
                ]
                p_id       = #(gameui_get_id waw_categorytile)
            ]

            ui_waw_categorytile [
                p_label    = "Soldier Management"
                p_sublabel = "Customize your character, loadout and vanities"
                p_width    = 0.6
                p_on_click = [
                    gameui_open ui_gameui_player
                ]
                p_id       = #(gameui_get_id waw_categorytile)
            ]

            // In-match-only options.
            if $isconnected [
                ui_waw_categorytile [
                    p_label    = "Vote Map / Mode"
                    p_sublabel = "Call a vote to change the current match"
                    p_width    = 0.6
                    p_on_click = [
                        gameui_open ui_gameui_vote
                    ]
                    p_id       = #(gameui_get_id waw_categorytile)
                ]

                ui_waw_categorytile [
                    p_label    = "Change Team"
                    p_sublabel = "Switch sides in the current match"
                    p_width    = 0.6
                    p_on_click = [
                        gameui_open ui_gameui_team
                    ]
                    p_id       = #(gameui_get_id waw_categorytile)
                ]
            ]
        ]

        uifill 0 0.01

        ui_waw_divider 0.6
    ]

    #(ui_gameui_backbutton)
]
