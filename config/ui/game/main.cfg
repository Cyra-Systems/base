// World at War-styled main menu hub.
//
// Layout:
//   left  — game categories (Multiplayer / Zombies / Campaign) as big tiles,
//           then secondary actions (Player Setup, Settings, Variables,
//           Support, Leave, Quit) as compact rows
//   right — live 3D player preview wrapped in a "DOSSIER" frame
//
// The side panels (settings, player setup, etc.) keep their original
// styling — only this top-level hub is WaW-themed for now.

gameui_begin_ids

ui_gameui_main_dims = 1.05

ui_gameui_main_on_open = [
    // Make sure the player preview state is populated. Mirrors what
    // ui_gameui_player_on_open does for the regular player setup screen.
    if $gameui_player_first_show [
        gameui_player_reset
        gameui_player_first_show = 0
    ]
    gameui_player_set_content $GAMEUI_PLAYER_CONTENT_BASIC 1

    gameui_player_vanity_type_focus_interp = [0 0 0 140]
    gameui_player_vanity_type_focus_anim   = 1
    gameui_player_vanity_type_focus        = -1
]

# ui_gameui_main = [
    local _left_w _right_w _gap _content_h
    _left_w    = 0.62
    _right_w   = 0.38
    _gap       = 0.018
    _content_h = 0.7

    uivlist 0.012 [
        uistyle lefttop
        uistyle clampx

        // Top branding band
        uicolour 0x55010101 0 0 [
            uistyle clampx

            uihlist 0.018 [
                uialign -1 0

                uiimage $logotex 0xffffff 1 0.32 0.16
                uivlist 0.002 [
                    uialign -1 0
                    ui_waw_title "Cyra" 2.6
                    ui_waw_subtitle "// World at War — operations briefing"
                ]
            ]

            ui_gameui_shadowhoriz
        ]

        uifill 0 0.005

        // Two-column body
        uihlist $_gap [
            uistyle clampx
            uialign -1 -1

            // ============ LEFT COLUMN ============
            uifill $_left_w $_content_h [
                uialign -1 -1

                uivlist 0.014 [
                    uistyle lefttop

                    // -------- Category tiles --------
                    uifont $textfontoutline [
                        uicolourtext "GAME MODES" $WAW_COL_KHAKI 0.95
                    ]

                    ui_waw_categorytile [
                        p_label    = "Multiplayer"
                        p_sublabel = "Online and offline matches against players & bots"
                        p_width    = $_left_w
                        p_height   = 0.07
                        p_on_click = [
                            gameui_open ui_gameui_multiplayer
                        ]
                        p_id       = #(gameui_get_id waw_categorytile)
                    ]

                    ui_waw_categorytile [
                        p_label    = "Zombies"
                        p_sublabel = "Survive the undead horde"
                        p_width    = $_left_w
                        p_height   = 0.07
                        p_on_click = [
                            gameui_open ui_gameui_zombies
                        ]
                        p_id       = #(gameui_get_id waw_categorytile)
                    ]

                    ui_waw_categorytile [
                        p_label    = "Campaign"
                        p_sublabel = "Solo missions and content creation"
                        p_width    = $_left_w
                        p_height   = 0.07
                        p_on_click = [
                            gameui_open ui_gameui_campaign
                        ]
                        p_id       = #(gameui_get_id waw_categorytile)
                    ]

                    uifill 0 0.006
                    ui_waw_divider $_left_w
                    uifill 0 0.004

                    // -------- Secondary actions --------
                    uifont $textfontoutline [
                        uicolourtext "OPERATIONS" $WAW_COL_KHAKI 0.95
                    ]

                    uigrid 2 0 0.004 [
                        uistyle clampx

                        ui_waw_softbutton [
                            p_label    = "Player Setup"
                            p_width    = (-f (*f $_left_w 0.5) 0.004)
                            p_on_click = [ gameui_open ui_gameui_player ]
                            p_id       = #(gameui_get_id waw_softbutton)
                        ]
                        ui_waw_softbutton [
                            p_label    = "Settings"
                            p_width    = (-f (*f $_left_w 0.5) 0.004)
                            p_on_click = [ gameui_open ui_gameui_settings ]
                            p_id       = #(gameui_get_id waw_softbutton)
                        ]

                        ui_waw_softbutton [
                            p_label    = "Variables"
                            p_width    = (-f (*f $_left_w 0.5) 0.004)
                            p_on_click = [ gameui_open ui_gameui_variables ]
                            p_id       = #(gameui_get_id waw_softbutton)
                        ]
                        ui_waw_softbutton [
                            p_label    = "Support"
                            p_width    = (-f (*f $_left_w 0.5) 0.004)
                            p_on_click = [ gameui_open ui_gameui_support ]
                            p_id       = #(gameui_get_id waw_softbutton)
                        ]
                    ]

                    uifill 0 0.006
                    ui_waw_divider $_left_w
                    uifill 0 0.004

                    // -------- Exit row --------
                    uihlist 0.008 [
                        uialign -1 0

                        if $isconnected [
                            ui_waw_softbutton [
                                p_label    = "Leave Match"
                                p_width    = 0.22
                                p_on_click = [
                                    gameui_confirm "Leave the current match?" [
                                        disconnect
                                    ]
                                ]
                                p_id       = #(gameui_get_id waw_softbutton)
                            ]
                        ]

                        ui_waw_softbutton [
                            p_label    = "Quit to Desktop"
                            p_width    = 0.22
                            p_on_click = [
                                gameui_confirm "Quit Cyra?" [
                                    quit
                                ]
                            ]
                            p_id       = #(gameui_get_id waw_softbutton)
                        ]
                    ]

                    // -------- Tip line --------
                    uifill 0 0.008
                    ui_gameui_autoscrollh [
                        uicolourtext (? $gameui_hovering $gameui_tip "") $WAW_COL_CREAM_DIM 0.9
                    ] [
                        p_width = $_left_w
                    ]
                ]
            ]

            // ============ RIGHT COLUMN ============
            uifill $_right_w $_content_h [
                uialign -1 -1

                ui_waw_player_widget $_right_w (-f $_content_h 0.08)
            ]
        ]
    ]

    if $isconnected [
        #(ui_gameui_backbutton)
    ]
]

gameui_main_handler = [
    togglescores 0
    gameui_open ui_gameui_main
]
gameui_panel_default = gameui_main_handler
