// World at War-style main menu.
//
// Minimal: stenciled section title with a khaki rule under it, vertical
// list of plain text rows. Active row gets a small gold bullet and gold
// text. Background photo, Message of the Day, and bottom-right logo are
// drawn by ui_cyra_menu_chrome (waw_style.cfg) outside the centered panel.

gameui_begin_ids

ui_gameui_main_dims = [0.55 0.08]

ui_gameui_main_on_open = [
    // Initialise player state in case the player decides to dive into
    // Soldier Management — the dossier panel itself isn't on this hub
    // anymore, but the side screens still depend on the same state.
    if $gameui_player_first_show [
        gameui_player_reset
        gameui_player_first_show = 0
    ]
    gameui_player_set_content $GAMEUI_PLAYER_CONTENT_BASIC 1
]

# ui_gameui_main = [
    local _w
    _w = $gameui_panel_new_size

    uivlist 0.022 [
        uistyle lefttop
        uistyle clampx

        uifill 0 0.04

        ui_waw_panel_title "MAIN MENU" $_w

        uifill 0 0.012

        // ---- Top-level categories ----
        uivlist 0.002 [
            uialign -1 -1

            ui_waw_menurow [
                p_label    = "MULTIPLAYER"
                p_width    = $_w
                p_on_click = [ gameui_open ui_gameui_multiplayer ]
                p_id       = #(gameui_get_id waw_menurow)
            ]

            ui_waw_menurow [
                p_label    = "ZOMBIES"
                p_width    = $_w
                p_locked   = 1
                p_badge    = "COMING SOON"
                p_id       = #(gameui_get_id waw_menurow)
            ]

            ui_waw_menurow [
                p_label    = "CAMPAIGN"
                p_width    = $_w
                p_locked   = 1
                p_badge    = "COMING SOON"
                p_id       = #(gameui_get_id waw_menurow)
            ]
        ]

        uifill 0 0.018

        // ---- Player & system ----
        uivlist 0.002 [
            uialign -1 -1

            ui_waw_menurow [
                p_label    = "PLAYER SETUP"
                p_width    = $_w
                p_on_click = [ gameui_open ui_gameui_player ]
                p_id       = #(gameui_get_id waw_menurow)
            ]

            ui_waw_menurow [
                p_label    = "OPTIONS"
                p_width    = $_w
                p_on_click = [ gameui_open ui_gameui_settings ]
                p_id       = #(gameui_get_id waw_menurow)
            ]

            ui_waw_menurow [
                p_label    = "VARIABLES"
                p_width    = $_w
                p_on_click = [ gameui_open ui_gameui_variables ]
                p_id       = #(gameui_get_id waw_menurow)
            ]

            ui_waw_menurow [
                p_label    = "CREDITS"
                p_width    = $_w
                p_on_click = [ gameui_open ui_gameui_support ]
                p_id       = #(gameui_get_id waw_menurow)
            ]
        ]

        uifill 0 0.018

        // ---- Exit ----
        uivlist 0.002 [
            uialign -1 -1

            if $isconnected [
                ui_waw_menurow [
                    p_label    = "LEAVE MATCH"
                    p_width    = $_w
                    p_on_click = [
                        gameui_confirm "Leave the current match?" [
                            disconnect
                        ]
                    ]
                    p_id       = #(gameui_get_id waw_menurow)
                ]
            ]

            ui_waw_menurow [
                p_label    = "QUIT"
                p_width    = $_w
                p_on_click = [
                    gameui_confirm "Quit Cyra?" [
                        quit
                    ]
                ]
                p_id       = #(gameui_get_id waw_menurow)
            ]
        ]
    ]

    if $isconnected [
        #(ui_gameui_backbutton)
    ]
]

gameui_main_handler = [
    togglescores 0
    gameui_open ui_gameui_main
]
gameui_panel_default = gameui_main_handler
