// Zombies category sub-hub. None of these modes are implemented yet — the
// hub exists so the main menu structure stays consistent and the modes can
// be wired up incrementally.

gameui_begin_ids

ui_gameui_zombies_dims = 0.7

# ui_gameui_zombies = [
    uivlist 0.018 [
        uistyle lefttop
        uistyle clampx

        uifill 0 0.04

        uicolour 0x55010101 0 0 [
            uistyle clampx

            ui_waw_title "Zombies"
            uispace 0 0.002
            ui_waw_subtitle "// Survive the undead horde"
            ui_gameui_shadowhoriz
        ]

        uifill 0 0.012

        uivlist 0.008 [
            uialign -1 -1

            ui_waw_categorytile [
                p_label    = "Find Match"
                p_sublabel = "Coming in a future update"
                p_width    = 0.6
                p_locked   = 1
                p_badge    = "COMING SOON"
                p_id       = #(gameui_get_id waw_categorytile)
            ]

            ui_waw_categorytile [
                p_label    = "Offline Match"
                p_sublabel = "Coming in a future update"
                p_width    = 0.6
                p_locked   = 1
                p_badge    = "COMING SOON"
                p_id       = #(gameui_get_id waw_categorytile)
            ]

            ui_waw_categorytile [
                p_label    = "Soldier Management"
                p_sublabel = "Customize your character, loadout and vanities"
                p_width    = 0.6
                p_on_click = [
                    gameui_open ui_gameui_player
                ]
                p_id       = #(gameui_get_id waw_categorytile)
            ]
        ]

        uifill 0 0.01

        ui_waw_divider 0.6
    ]

    #(ui_gameui_backbutton)
]
