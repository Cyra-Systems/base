// Editor "Rules" panel — Forge-style map-mode bundling.
// Opens from inside the map editor and exposes the rule fields that
// modify how the map plays. Saved into the map's `mode_anchor` trigger
// (script id 9999) so the map IS its mode when loaded.
//
// First UI for Layer 2 of /MODES.md. Scaffolding only — the actual
// "save these settings into the anchor trigger entity" logic needs the
// engine to expose entity-attrs-write to script, which is partial today.

gameui_begin_ids

ui_gameui_editor_rules_dims = [0.55 0.7]

// Working state — populated by the panel when opened, applied when saved
editor_rules_win_condition  = "WIN_HIGHEST_SCORE_AT_TIME"
editor_rules_score_cap      = 75
editor_rules_time_limit     = 600
editor_rules_loadout_policy = "LOADOUT_FIXED"
editor_rules_allow_perks    = 1
editor_rules_allow_vehicles = 0
editor_rules_friendly_fire  = 0
editor_rules_respawn        = 1

// Enum option lists for dropdowns
editor_rules_win_options = [
    "WIN_LAST_STANDING"
    "WIN_FIRST_TO_N_KILLS"
    "WIN_HOLD_ZONE"
    "WIN_HIGHEST_SCORE_AT_TIME"
]

editor_rules_loadout_options = [
    "LOADOUT_MELEE_ONLY"
    "LOADOUT_ROTATING"
    "LOADOUT_FIXED"
    "LOADOUT_PICK10"
]

# ui_gameui_editor_rules = [
    uivlist 0 [
        uitext "Map Rules" 6
        uispace 0 0.02

        uitext "These settings get baked into the map's mode_anchor trigger. The map ships them as part of its file." 2
        uispace 0 0.02

        // Win condition
        uihlist 0 [
            uitext "Win condition:" 3
            uispace 0.01 0
            ui_gameui_prettybutton [
                p_label    = $editor_rules_win_condition
                p_on_click = [
                    local i = (indexof $editor_rules_win_options $editor_rules_win_condition)
                    local n = (mod (+ $i 1) (listlen $editor_rules_win_options))
                    editor_rules_win_condition = (at $editor_rules_win_options $n)
                ]
                p_id       = #(gameui_get_id prettybutton)
            ]
        ]

        // Score cap
        uihlist 0 [
            uitext "Score cap:" 3
            uispace 0.01 0
            uifield editor_rules_score_cap 6
        ]

        // Time limit
        uihlist 0 [
            uitext "Time limit (s):" 3
            uispace 0.01 0
            uifield editor_rules_time_limit 6
        ]

        // Loadout policy
        uihlist 0 [
            uitext "Loadout policy:" 3
            uispace 0.01 0
            ui_gameui_prettybutton [
                p_label    = $editor_rules_loadout_policy
                p_on_click = [
                    local i = (indexof $editor_rules_loadout_options $editor_rules_loadout_policy)
                    local n = (mod (+ $i 1) (listlen $editor_rules_loadout_options))
                    editor_rules_loadout_policy = (at $editor_rules_loadout_options $n)
                ]
                p_id       = #(gameui_get_id prettybutton)
            ]
        ]

        // Flag toggles
        uihlist 0 [
            uitext "Perks allowed:" 3
            uispace 0.01 0
            ui_gameui_prettybutton [
                p_label    = (? $editor_rules_allow_perks "Yes" "No")
                p_on_click = [ editor_rules_allow_perks = (! $editor_rules_allow_perks) ]
                p_id       = #(gameui_get_id prettybutton)
            ]
        ]

        uihlist 0 [
            uitext "Vehicles allowed:" 3
            uispace 0.01 0
            ui_gameui_prettybutton [
                p_label    = (? $editor_rules_allow_vehicles "Yes" "No")
                p_on_click = [ editor_rules_allow_vehicles = (! $editor_rules_allow_vehicles) ]
                p_id       = #(gameui_get_id prettybutton)
            ]
        ]

        uihlist 0 [
            uitext "Friendly fire:" 3
            uispace 0.01 0
            ui_gameui_prettybutton [
                p_label    = (? $editor_rules_friendly_fire "Yes" "No")
                p_on_click = [ editor_rules_friendly_fire = (! $editor_rules_friendly_fire) ]
                p_id       = #(gameui_get_id prettybutton)
            ]
        ]

        uihlist 0 [
            uitext "Respawn enabled:" 3
            uispace 0.01 0
            ui_gameui_prettybutton [
                p_label    = (? $editor_rules_respawn "Yes" "No")
                p_on_click = [ editor_rules_respawn = (! $editor_rules_respawn) ]
                p_id       = #(gameui_get_id prettybutton)
            ]
        ]

        uispace 0 0.03

        // Save + Close buttons
        uihlist 0.02 [
            ui_gameui_prettybutton [
                p_label    = "Save to map"
                p_tip      = "Writes settings to the map's mode_anchor trigger (script id 9999)"
                p_on_click = [
                    editor_rules_save
                    gameui_close
                ]
                p_id       = #(gameui_get_id prettybutton)
            ]
            ui_gameui_prettybutton [
                p_label    = "Cancel"
                p_on_click = [ gameui_close ]
                p_id       = #(gameui_get_id prettybutton)
            ]
        ]
    ]
]

// Save handler — finds or creates the mode_anchor trigger entity and
// writes the rule fields into its attrs.
//
// Engine bridge needed: ability to find-or-create an entity from script,
// and write to its attrs. RE has entity creation via /newent in the editor;
// what we need is a scriptable wrapper. This is the most pressing engine
// gap for Forge-style editing.
editor_rules_save = [
    echo (format "[editor-rules-stub] would save: win=%1 cap=%2 time=%3 loadout=%4 perks=%5 vehicles=%6 ff=%7 respawn=%8" \
        $editor_rules_win_condition $editor_rules_score_cap $editor_rules_time_limit \
        $editor_rules_loadout_policy $editor_rules_allow_perks $editor_rules_allow_vehicles \
        $editor_rules_friendly_fire $editor_rules_respawn)
    // TODO: real save once entity-write-from-script is bridged
]
