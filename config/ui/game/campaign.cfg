// Campaign category sub-hub. Story mode isn't implemented; for now the
// hub also hosts the Map Editor since that fits the "single-player
// content creation" bucket better than living at the top level.

gameui_begin_ids

ui_gameui_campaign_dims = 0.7

# ui_gameui_campaign = [
    uivlist 0.018 [
        uistyle lefttop
        uistyle clampx

        uifill 0 0.04

        uicolour 0x55010101 0 0 [
            uistyle clampx

            ui_waw_title "Campaign"
            uispace 0 0.002
            ui_waw_subtitle "// Solo missions and content creation"
            ui_gameui_shadowhoriz
        ]

        uifill 0 0.012

        uivlist 0.008 [
            uialign -1 -1

            ui_waw_categorytile [
                p_label    = "Story"
                p_sublabel = "Single-player narrative campaign"
                p_width    = 0.6
                p_locked   = 1
                p_badge    = "COMING SOON"
                p_id       = #(gameui_get_id waw_categorytile)
            ]

            ui_waw_categorytile [
                p_label    = "Bot Skirmish"
                p_sublabel = "Pick a map and battle bots solo"
                p_width    = 0.6
                p_on_click = [
                    gameui_open ui_gameui_maps
                ]
                p_id       = #(gameui_get_id waw_categorytile)
            ]

            // Map editor lives here unless mode-locked away.
            if (ismodelocked 2) [] [
                ui_waw_categorytile [
                    p_label    = "Map Editor"
                    p_sublabel = "Build and edit maps in-game"
                    p_width    = 0.6
                    p_on_click = [
                        gameui_open ui_gameui_editor
                    ]
                    p_id       = #(gameui_get_id waw_categorytile)
                ]
            ]
        ]

        uifill 0 0.01

        ui_waw_divider 0.6
    ]

    #(ui_gameui_backbutton)
]
