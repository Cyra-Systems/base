// Party Modes selection panel.
// Lists modes from the framework registry (config/modes/framework.cfg).
// Clicking a mode calls setmode <id>.
//
// First UI surface for the Forge-style framework. Minimal styling — mirrors
// the main menu's prettybutton pattern. Polish + previews land later.

gameui_begin_ids

ui_gameui_modes_dims = [0.5 0.6]

# ui_gameui_modes = [
    uivlist 0 [
        uitext "Party Modes" 6
        uispace 0 0.02

        // Iterate the mode registry and render a button per entry.
        // The registry is built dynamically by registermode calls in
        // config/modes/*.cfg, so adding a new mode auto-appears here.
        if (> (listlen $mode_registry) 0) [
            loop i (listlen $mode_registry) [
                local _modeid = (at $mode_registry $i)
                ui_gameui_prettybutton [
                    p_label    = (getalias (concatword "mode_label_" $_modeid))
                    p_tip      = (getalias (concatword "mode_desc_"  $_modeid))
                    p_on_click = [
                        setmode $_modeid
                        gameui_close_all
                    ]
                    p_id       = #(gameui_get_id prettybutton)
                ]
            ]
        ] [
            uitext "No modes registered yet." 3
        ]

        uispace 0 0.02

        ui_gameui_prettybutton [
            p_label    = "Back"
            p_tip      = "Return to main menu"
            p_on_click = [ gameui_open ui_gameui_main ]
            p_id       = #(gameui_get_id prettybutton)
        ]
    ]
]
