// World at War-inspired styling helpers for the categorized main hub.
//
// Goal: gritty, military, sepia/olive feel without forking every existing
// widget. New screens that want the WaW look use these helpers; deeper
// panels (settings, player setup, etc.) keep their native styling.
//
// Conventions:
//   WAW_COL_*   — hex AARRGGBB colours
//   ui_waw_*    — composable visual primitives
//   gameui_waw_* — helpers that drive logic



/////////////
// PALETTE //
/////////////



WAW_COL_PANEL_DEEP   = 0xee0a0a08    // near-black panel base, warm tint
WAW_COL_PANEL        = 0xcc1a1a12    // standard panel fill
WAW_COL_PANEL_LIGHT  = 0x661a1a12    // subtle inner fill
WAW_COL_OLIVE_DARK   = 0xff2a2c1a    // dark olive drab
WAW_COL_OLIVE        = 0xff4a4d2c    // olive drab
WAW_COL_OLIVE_LIGHT  = 0xff6a6d3c    // brighter olive (hover)
WAW_COL_KHAKI        = 0xffc8a25a    // faded gold/khaki accent
WAW_COL_KHAKI_DIM    = 0x99c8a25a
WAW_COL_CREAM        = 0xfff5e9c8    // primary text
WAW_COL_CREAM_DIM    = 0xaaf5e9c8
WAW_COL_PAPER        = 0xffd8c89c    // paper / parchment
WAW_COL_BLOOD        = 0xffa5341e    // faded brick red, danger / locked
WAW_COL_BLOOD_DIM    = 0xaaa5341e
WAW_COL_GREASE       = 0xff15140d    // darker than panel, sub-divider



//////////////////////
// VISUAL PRIMITIVES//
//////////////////////



// Dark olive panel background, sized to parent. Use under content groups.
ui_waw_panel = [
    uiborderedimageclamped $skintex $WAW_COL_PANEL 0 $ui_texborder $ui_screenborder 0 0 [
        uistyle clampxy

        uiborderedimageclamped $skinshadowtex $WAW_COL_GREASE 0 $ui_texborder $ui_screenborder 0 0 [
            uistyle clampxy
            uipropagate [uicolourblend 0.4]
        ]
    ]
]

// Heavier panel for the main hub frame.
ui_waw_panel_deep = [
    uiborderedimageclamped $skintex $WAW_COL_PANEL_DEEP 0 $ui_texborder $ui_screenborder 0 0 [
        uistyle clampxy
    ]
]

// Khaki underline used to separate sections, "torn paper" feel via a
// fading horizontal shadow band.
// 1:<width>
ui_waw_divider = [
    uifill $arg1 0.005 [
        uicolour $WAW_COL_KHAKI_DIM $arg1 0.0015
        uiprev [uialign 0 0]
    ]
]

// Big stencil-style title, no animated chrome (unlike ui_gameui_decortext
// which has the salmon glow). Uses the outline font for a stenciled look.
// 1:<text> 2:<size>
ui_waw_title = [
    uifont $textfontoutline [
        uicolourtext $arg1 $WAW_COL_CREAM (? (> $numargs 1) $arg2 2.4)
    ]
]

// Smaller subtitle under titles.
// 1:<text>
ui_waw_subtitle = [
    uifont $textfontoutline [
        uicolourtext $arg1 $WAW_COL_KHAKI 1.0
    ]
]

// "Coming soon" / locked badge, displayed inline.
// 1:<label>
ui_waw_locked_badge = [
    uispace 0.006 0.002 [
        uicolour $WAW_COL_BLOOD_DIM 0 0 [
            uistyle clampxy
            uispace 0.006 0.002 [
                uicolourtext $arg1 $WAW_COL_CREAM 0.85
            ]
        ]
    ]
]



//////////////
// CATEGORY //
//////////////



// Big WaW-style category tile. Wide horizontal bar, dark olive base, cream
// stenciled label. On hover the bar brightens and a khaki underline glows.
//
// Props:
//   p_label       — title text (e.g. "Multiplayer")
//   p_sublabel    — small line under title (e.g. "Online & offline matches")
//   p_locked      — non-zero means locked: greyed out, blood-red corner badge,
//                   on_click suppressed
//   p_badge       — optional short string drawn as a locked badge
//   p_width       — tile width (default 0.6)
//   p_height      — tile height (default 0.075)
//   p_on_click    — click handler
//   p_on_hover    — hover handler
//   p_id          — widget id

gameui_waw_categorytile_props = [
    [ p_label          ""              ]
    [ p_sublabel       ""              ]
    [ p_locked         0               ]
    [ p_badge          ""              ]
    [ p_tip            ""              ]
    [ p_width          0.6             ]
    [ p_height         0.075           ]
    [ p_on_click       []              ]
    [ p_on_hover       []              ]
    [ p_anim_on_time   80              ]
    [ p_anim_off_time  160             ]
    [ p_id             []              ]
    [ p_sound_activate S_UI_ACTION     ]
    [ p_sound_hover    S_UI_HOVER      ]
]

# ui_waw_categorytile = [
    @(props $gameui_waw_categorytile_props arg1)

    local _anim_state_var _anim_state _anim_state_hover _anim_state_activate _hovering
    local _bg_col _label_col _underline_w
    _anim_state_var      = @(gameui_get_anim_var p_id)
    _anim_state          = (getalias $_anim_state_var)
    _anim_state_hover    = (at $_anim_state 0)
    _anim_state_activate = (at $_anim_state 1)
    _hovering            = 0

    _anim_state_activate = (animstep $_anim_state_activate 200 -1)

    uitarget $p_width $p_height [
        if $p_locked [] [
            uihover [
                if (gameui_can_interact) [
                    gameui_hover

                    _anim_state_hover = (animstep $_anim_state_hover $p_anim_on_time 1)
                    _hovering         = 1

                    p_on_hover
                ]
            ] [
                _anim_state_hover = (animstep $_anim_state_hover $p_anim_off_time -1)
            ]

            uirelease [
                if (!=s $p_on_click "") [
                    _anim_state_activate = 1
                    soundbyname $p_sound_activate
                    sleep 0 [
                        local _func
                        _func = [@@p_on_click]
                        _func @uilastsx @uilastsy @uilastw @uilasth
                    ]
                ]
            ]
        ]

        // Background: dark olive lerp to lighter olive on hover. Locked
        // tiles stay grey to read as "unavailable".
        _bg_col = (? $p_locked $WAW_COL_GREASE (
            ? $_hovering $WAW_COL_OLIVE_LIGHT $WAW_COL_OLIVE_DARK
        ))

        uiborderedimageclamped $skintex $_bg_col 0 $ui_texborder $ui_screenborder 0 0 [
            uistyle clampxy
            uipropagate [uicolourblend (? $p_locked 0.55 (lerpf 0.6 0.95 $_anim_state_hover))]
        ]

        // Inner shadow vignette
        uiborderedimageclamped $skinshadowtex 0xff000000 0 $ui_texborder $ui_screenborder 0 0 [
            uistyle clampxy
            uipropagate [uicolourblend 0.35]
        ]

        // Khaki underline that grows from center on hover. Skipped for locked.
        _underline_w = (*f $p_width (lerpf 0.15 0.92 $_anim_state_hover))
        if $p_locked [] [
            uifill $p_width $p_height [
                uistyle clampxy
                uialign 0 1
                uispace 0 0.004 [
                    uialign 0 1
                    uicolour $WAW_COL_KHAKI $_underline_w 0.0025
                ]
            ]
        ]

        // Activation flash
        if (>f $_anim_state_activate 0) [
            uiborderedimageclamped $blurskintex $WAW_COL_CREAM 0 $ui_texborder $ui_screenborder 0 0 [
                uistyle clampxy
                uipropagate [uicolourblend (*f $_anim_state_activate 0.35)]
            ]
        ]

        // Label block
        _label_col = (? $p_locked $WAW_COL_CREAM_DIM $WAW_COL_CREAM)

        uispace 0.025 0.012 [
            uistyle clampxy
            uialign -1 0

            uivlist 0.001 [
                uialign -1 0

                uifont $textfontoutline [
                    uicolourtext $p_label $_label_col (lerpf 1.7 1.85 $_anim_state_hover)
                ]
                uiprev [uialign -1 0]

                if (!=s $p_sublabel "") [
                    uicolourtext $p_sublabel $WAW_COL_CREAM_DIM 0.85
                    uiprev [uialign -1 0]
                ]
            ]
        ]

        // Right-side badge area (locked / coming soon)
        if (!=s $p_badge "") [
            uifill $p_width $p_height [
                uistyle clampxy
                uialign 1 0
                uispace 0.018 0 [
                    uialign 1 0
                    ui_waw_locked_badge $p_badge
                ]
            ]
        ]

        ui_gameui_shadow
    ]

    $_anim_state_var = [@_anim_state_hover @_anim_state_activate]
]
gameui_widget_register waw_categorytile 1



////////////////////
// SOFT TEXT BTN  //
////////////////////



// Smaller, less ornate row button for secondary actions (Settings,
// Variables, Support, Quit). No glowing chrome; just a cream label that
// brightens and underlines on hover.
//
// Props mirror prettybutton's shape but render in WaW palette.

gameui_waw_softbutton_props = [
    [ p_label          ""              ]
    [ p_sublabel       ""              ]
    [ p_label_size     1.2             ]
    [ p_label_align    -1              ]
    [ p_tip            ""              ]
    [ p_width          0.5             ]
    [ p_height         0.034           ]
    [ p_on_click       []              ]
    [ p_on_hover       []              ]
    [ p_anim_on_time   60              ]
    [ p_anim_off_time  120             ]
    [ p_id             []              ]
    [ p_sound_activate S_UI_ACTION     ]
    [ p_sound_hover    S_UI_HOVER      ]
    [ p_disabled       0               ]
]

# ui_waw_softbutton = [
    @(props $gameui_waw_softbutton_props arg1)

    local _anim_state_var _anim_state _anim_state_hover _hovering _label_col _x_inset
    _anim_state_var   = @(gameui_get_anim_var p_id)
    _anim_state       = (getalias $_anim_state_var)
    _anim_state_hover = (at $_anim_state 0)
    _hovering         = 0

    uitarget $p_width $p_height [
        if $p_disabled [] [
            uihover [
                if (gameui_can_interact) [
                    gameui_hover
                    _anim_state_hover = (animstep $_anim_state_hover $p_anim_on_time 1)
                    _hovering         = 1
                    p_on_hover
                ]
            ] [
                _anim_state_hover = (animstep $_anim_state_hover $p_anim_off_time -1)
            ]

            uirelease [
                if (!=s $p_on_click "") [
                    soundbyname $p_sound_activate
                    sleep 0 [
                        local _func
                        _func = [@@p_on_click]
                        _func @uilastsx @uilastsy @uilastw @uilasth
                    ]
                ]
            ]
        ]

        // Faint olive bar that appears on hover behind the text.
        if (>f $_anim_state_hover 0) [
            uicolour $WAW_COL_OLIVE_DARK $p_width $p_height [
                uistyle clampxy
                uipropagate [uicolourblend (*f $_anim_state_hover 0.7)]
            ]
        ]

        // Left edge khaki tick on hover.
        uifill $p_width $p_height [
            uistyle clampxy
            uialign -1 0
            uicolour $WAW_COL_KHAKI 0.003 (*f $p_height (lerpf 0.0 0.85 $_anim_state_hover))
        ]

        _label_col = (? $p_disabled $WAW_COL_CREAM_DIM (
            ? $_hovering $WAW_COL_CREAM $WAW_COL_PAPER
        ))
        _x_inset = (lerpf 0.014 0.022 $_anim_state_hover)

        uispace $_x_inset 0.004 [
            uistyle clampxy
            uialign $p_label_align 0

            uifont $textfontoutline [
                uicolourtext $p_label $_label_col $p_label_size
            ]
        ]
    ]

    $_anim_state_var = [@_anim_state_hover 0]
]
gameui_widget_register waw_softbutton 1



////////////////////
// PLAYER PREVIEW //
////////////////////



// Wraps the existing ui_gameui_player_preview in a WaW-themed dossier
// frame: dark panel, khaki edge, "PROFILE" header band, player name
// underneath. Caller must have called gameui_player_reset (or relied on
// ui_gameui_player_on_open / ui_gameui_main_on_open) to populate state.
//
// 1:<width> 2:<height>
ui_waw_player_widget = [
    uifill $arg1 (+f $arg2 0.07) [
        uistyle clampxy

        ui_waw_panel_deep

        uivlist 0.006 [
            uistyle clampxy
            uialign 0 -1

            // Header band
            uispace 0.012 0.006 [
                uistyle clampx
                uialign 0 -1

                uicolour $WAW_COL_OLIVE_DARK $arg1 0 [
                    uistyle clampx
                    uispace 0.014 0.005 [
                        uistyle clampx
                        uifont $textfontoutline [
                            uicolourtext "DOSSIER" $WAW_COL_KHAKI 1.0
                        ]
                    ]
                ]
                uiprev [uistyle clampx]
            ]

            // The actual 3D player preview
            ui_gameui_player_preview $arg1 $arg2

            // Name plate at the bottom
            uispace 0.012 0.006 [
                uistyle clampx
                uialign 0 1

                uicolour $WAW_COL_GREASE $arg1 0 [
                    uistyle clampx
                    uispace 0.014 0.006 [
                        uistyle clampx

                        uihlist 0.012 [
                            uialign -1 0

                            uifont $textfontoutline [
                                uicolourtext (? (=s $gameui_player_name "") $playername $gameui_player_name) $WAW_COL_CREAM 1.2
                            ]
                            uicolourtext "// READY FOR DEPLOYMENT" $WAW_COL_KHAKI_DIM 0.75
                        ]
                    ]
                ]
                uiprev [uistyle clampx]
            ]
        ]
    ]
]
