// World at War-styled menu helpers.
//
// Style philosophy: minimalist. Real WaW menus are just stenciled text on
// an atmospheric photo. No tile chrome, no panels around items. The
// active row gets a gold tint, a small bullet, and a subtle dark band —
// that's it.



/////////////
// PALETTE //
/////////////



WAW_COL_CREAM        = 0xfff5e9c8    // primary text
WAW_COL_CREAM_DIM    = 0xaaf5e9c8
WAW_COL_PAPER        = 0xffd8c89c
WAW_COL_GOLD         = 0xfff5b048    // active / hover text
WAW_COL_GOLD_DIM     = 0xaaf5b048
WAW_COL_KHAKI        = 0xffc8a25a    // accents, rules
WAW_COL_KHAKI_DIM    = 0x99c8a25a
WAW_COL_OLIVE_DARK   = 0xff2a2c1a
WAW_COL_BLOOD        = 0xffa5341e    // locked / danger
WAW_COL_BLOOD_DIM    = 0xaaa5341e
WAW_COL_GREASE       = 0xff15140d
WAW_COL_PANEL_FADE   = 0x88000000    // semi-opaque overlay for MOTD box
WAW_COL_ROW_HOVER    = 0x55000000    // subtle dark band under the hovered row



/////////////////
// USER VARS   //
/////////////////



// Path to a full-screen photo drawn behind the menu when not in a match.
// Drop a JPG/PNG into data/textures/ui/menu_bg.<ext> and set this var,
// or override it in autoexec.cfg. Empty string = no background image.
deftvarp cyra_menu_bg_tex ""

// Message of the Day shown in the bottom-left panel.
defsvarp cyra_menu_motd "Welcome to Cyra. Connect to a server or start an offline match to begin."

// Logo texture used in the bottom-right. Falls back to engine $logotex.
deftvarp cyra_menu_logo_tex ""



////////////////
// PRIMITIVES //
////////////////



// Big stenciled title used at the top of each panel ("MAIN MENU",
// "MULTIPLAYER"). Drawn left-aligned with a khaki horizontal rule under it.
// 1:<text> 2:<panel width>
ui_waw_panel_title = [
    uifill $arg2 0 [
        uialign -1 -1

        uivlist 0.006 [
            uialign -1 -1

            uifont $textfontoutline [
                uicolourtext $arg1 $WAW_COL_CREAM 2.6
            ]
            uiprev [uialign -1 -1]

            // Khaki rule the width of the panel, with a brighter cap on
            // the left under the title for that "marked" feel.
            uifill $arg2 0.003 [
                uialign -1 -1
                uicolour $WAW_COL_KHAKI_DIM $arg2 0.001
                uiprev [uialign -1 -1]
                uicolour $WAW_COL_KHAKI 0.06 0.0025
                uiprev [uialign -1 -1]
            ]
        ]
    ]
]

// Subtitle line, dim khaki.
// 1:<text>
ui_waw_subtitle = [
    uifont $textfontoutline [
        uicolourtext $arg1 $WAW_COL_KHAKI 1.0
    ]
]

// "Coming soon" / locked badge.
// 1:<label>
ui_waw_locked_badge = [
    uispace 0.006 0.002 [
        uicolour $WAW_COL_BLOOD_DIM 0 0 [
            uistyle clampxy
            uispace 0.006 0.002 [
                uifont $textfontoutline [
                    uicolourtext $arg1 $WAW_COL_CREAM 0.85
                ]
            ]
        ]
    ]
]



///////////////
// MENU ROW  //
///////////////



// The core WaW menu item: plain stenciled text, gold on hover, with a
// small leading bullet that appears under hover. No surrounding box.
//
// Props:
//   p_label    — text (e.g. "MULTIPLAYER")
//   p_locked   — non-zero: dimmed, click suppressed, optional badge
//   p_badge    — short badge string drawn to the right when locked
//   p_width    — row width (default 0.4)
//   p_height   — row height (default 0.05)
//   p_label_size — label scale (default 1.7)
//   p_on_click — click handler
//   p_id       — widget id

gameui_waw_menurow_props = [
    [ p_label          ""              ]
    [ p_locked         0               ]
    [ p_badge          ""              ]
    [ p_tip            ""              ]
    [ p_width          0.4             ]
    [ p_height         0.05            ]
    [ p_label_size     1.7             ]
    [ p_on_click       []              ]
    [ p_on_hover       []              ]
    [ p_anim_on_time   70              ]
    [ p_anim_off_time  140             ]
    [ p_id             []              ]
    [ p_sound_activate S_UI_ACTION     ]
    [ p_sound_hover    S_UI_HOVER      ]
]

# ui_waw_menurow = [
    @(props $gameui_waw_menurow_props arg1)

    local _anim_state_var _anim_state _anim_state_hover _hovering _label_col _bullet_size _x_inset
    _anim_state_var   = @(gameui_get_anim_var p_id)
    _anim_state       = (getalias $_anim_state_var)
    _anim_state_hover = (at $_anim_state 0)
    _hovering         = 0

    uitarget $p_width $p_height [
        if $p_locked [] [
            uihover [
                if (gameui_can_interact) [
                    gameui_hover
                    _anim_state_hover = (animstep $_anim_state_hover $p_anim_on_time 1)
                    _hovering         = 1
                    p_on_hover
                ]
            ] [
                _anim_state_hover = (animstep $_anim_state_hover $p_anim_off_time -1)
            ]

            uirelease [
                if (!=s $p_on_click "") [
                    soundbyname $p_sound_activate
                    sleep 0 [
                        local _func
                        _func = [@@p_on_click]
                        _func @uilastsx @uilastsy @uilastw @uilasth
                    ]
                ]
            ]
        ]

        // Subtle dark band behind the hovered row.
        if (>f $_anim_state_hover 0) [
            uicolour $WAW_COL_ROW_HOVER $p_width $p_height [
                uistyle clampxy
                uipropagate [uicolourblend $_anim_state_hover]
            ]
        ]

        // Leading bullet — small filled gold triangle that fades in.
        _bullet_size = (lerpf 0 0.012 $_anim_state_hover)
        if (>f $_anim_state_hover 0) [
            uifill $p_width $p_height [
                uistyle clampxy
                uialign -1 0
                uispace 0.012 0 [
                    uialign -1 0
                    uitriangle $WAW_COL_GOLD $_bullet_size $_bullet_size 90 [
                        uipropagate [uicolourblend $_anim_state_hover]
                    ]
                ]
            ]
        ]

        // Label
        _label_col = (? $p_locked $WAW_COL_CREAM_DIM (
            ? $_hovering $WAW_COL_GOLD $WAW_COL_CREAM
        ))
        _x_inset = (lerpf 0.012 0.030 $_anim_state_hover)

        uispace $_x_inset 0.006 [
            uistyle clampxy
            uialign -1 0

            uifont $textfontoutline [
                uicolourtext $p_label $_label_col $p_label_size
            ]
        ]

        // Right-side badge (locked)
        if (!=s $p_badge "") [
            uifill $p_width $p_height [
                uistyle clampxy
                uialign 1 0
                uispace 0.012 0 [
                    uialign 1 0
                    ui_waw_locked_badge $p_badge
                ]
            ]
        ]
    ]

    $_anim_state_var = [@_anim_state_hover 0]
]
gameui_widget_register waw_menurow 1



//////////////////////
// FULLSCREEN CHROME//
//////////////////////



// Drawn from ui_gameui_panel (common.cfg). Adds:
//   - Full-screen background photo (if cyra_menu_bg_tex is set)
//   - Bottom-left "Message of the Day" panel
//   - Bottom-right logo
//
// Only renders when we're not in a match — pausing in-game shouldn't
// repaint the world behind a photo.
ui_cyra_menu_chrome = [
    if $isconnected [] [
        // ---- Background photo ----
        if (!=s $cyra_menu_bg_tex "") [
            uifill $uiaspect 1 [
                uialign 0 0
                uiimage $cyra_menu_bg_tex 0xffffff 0 $uiaspect 1 [
                    // Darken so text on top reads. Pure overlay.
                    uipropagate [uicolourblend 0.7]
                ]
                // Darkening film on top of the photo
                uicolour 0xaa000000 $uiaspect 1
                uiprev [uistyle clampxy]
            ]
            uiprev [uialign 0 0]
        ]

        // ---- Bottom-left "Message of the Day" ----
        uispace 0.04 0.06 [
            uialign -1 1

            uifill 0.36 0.13 [
                uialign -1 -1

                uicolour $WAW_COL_PANEL_FADE 0.36 0.13 [
                    uistyle clampxy
                ]

                uispace 0.014 0.012 [
                    uistyle clampxy
                    uialign -1 -1

                    uivlist 0.005 [
                        uialign -1 -1

                        uifont $textfontoutline [
                            uicolourtext "MESSAGE OF THE DAY" $WAW_COL_KHAKI 0.95
                        ]
                        uifill 0.32 0.001 [
                            uialign -1 -1
                            uicolour $WAW_COL_KHAKI_DIM 0.32 0.001
                        ]
                        uifill 0 0.004

                        uicolourtext $cyra_menu_motd $WAW_COL_CREAM 0.95 [
                            uitextwrap 0.32
                        ]
                    ]
                ]
            ]
        ]
        uiprev [uialign -1 1]

        // ---- Bottom-right logo ----
        uispace 0.04 0.06 [
            uialign 1 1

            local _logo
            _logo = (? (=s $cyra_menu_logo_tex "") $logotex $cyra_menu_logo_tex)
            uiimage $_logo 0xffffff 1 0.4 0.18 [
                uipropagate [uicolourblend 0.95]
            ]
        ]
        uiprev [uialign 1 1]
    ]
]
