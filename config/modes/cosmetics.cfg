// Cosmetics — camos, emblems, banners.
// BO2-style: unlocks tied to challenges (kills with a weapon, headshots,
// no-death streaks). Cosmetic only — never affects gameplay balance.
//
// v1.0+ milestone. This file locks the data schema so progression hooks
// can fire even though the visual rendering / emblem editor are stubs.

// ---- CAMO UNLOCKS ----------------------------------------------------------
// Each weapon has a camo progression. Earning all camos on a single weapon
// unlocks the "Gold" camo. Earning Gold on all weapons in a category unlocks
// "Diamond". Earning Diamond across categories unlocks "DM Ultra" (BO2 used
// "Mastercraft" — same concept).

CAMO_CATEGORIES = [
    "smg" "ar" "shotgun" "lmg" "sniper" "pistol" "launcher" "melee"
]

camos_registry = []   // list of "<id> <weapon> <category> <challenge>"

camo_register = [
    // arg1 = id, arg2 = weapon, arg3 = category, arg4 = challenge_id,
    // arg5 = label, arg6 = unlock_condition_desc
    camos_registry = (concat $camos_registry (concatword $arg1 " " $arg2 " " $arg3))
    alias (concatword "camo_label_"      $arg1) $arg5
    alias (concatword "camo_condition_"  $arg1) $arg6
    alias (concatword "camo_challenge_"  $arg1) $arg4
]

// Example unlocks for one weapon (SMG). Real lists scale to ~50 unlocks per
// weapon when content team fills in.
camo_register "smg_blue"   "smg" "smg" "smg_kills_10"   "Blue"     "10 kills"
camo_register "smg_red"    "smg" "smg" "smg_kills_25"   "Red"      "25 kills"
camo_register "smg_woodland" "smg" "smg" "smg_kills_50" "Woodland" "50 kills"
camo_register "smg_gold"   "smg" "smg" "smg_master"     "Gold"     "Complete all SMG camos"
// ... rest delegated to content team

// Per-player progress counters. Each challenge tracked as <cn>_<challenge_id>.
camo_challenge_progress = []  // "<cn>_<challenge> <count>"

camo_increment_challenge = [
    // arg1 = cn, arg2 = challenge_id, arg3 = amount
    echo (format "[camo-stub] %1 +%3 on %2" $arg1 $arg2 $arg3)
    // TODO: persist progress, check unlock thresholds, fire unlock toast
]


// ---- EMBLEMS ---------------------------------------------------------------
// BO2 emblem editor allowed compositing up to 32 layers from a shape library.
// Each layer: shape, color, position, rotation, scale.
//
// Format: an emblem is stored as a JSON-ish flat list of layers.

EMBLEM_MAX_LAYERS = 32
EMBLEM_SHAPE_LIBRARY = [
    // primitives
    "circle" "square" "triangle" "diamond" "star" "heart" "arrow"
    // BO2-equivalent shape categories — content team expands
    "letter_a" "letter_b" "letter_c" "letter_d" "letter_e" "letter_f"
    "number_0" "number_1" "number_2" "number_3" "number_4" "number_5"
    "gradient_radial" "gradient_linear"
    "skull" "flame" "lightning" "crosshair" "scope"
    // ... real library grows to ~500 shapes
]

emblem_layers = []  // active editor session — list of "<shape> <r> <g> <b> <x> <y> <rot> <scale>"

emblem_addlayer = [
    // arg1..arg8 = shape r g b x y rot scale
    if (>= (listlen $emblem_layers) $EMBLEM_MAX_LAYERS) [
        echo (format "[emblem] layer cap reached (%1)" $EMBLEM_MAX_LAYERS)
        return
    ]
    emblem_layers = (concat $emblem_layers (concatword $arg1 " " $arg2 " " $arg3 " " $arg4 " " $arg5 " " $arg6 " " $arg7 " " $arg8))
]

emblem_clear = [ emblem_layers = [] ]

emblem_save = [
    // arg1 = slot name
    setalias (concatword "saved_emblem_" $arg1) $emblem_layers
    echo (format "[emblem] saved as '%1' (%2 layers)" $arg1 (listlen $emblem_layers))
]


// ---- BANNERS (calling cards) -----------------------------------------------
// Static images that show up as player calling cards. Unlocked via
// challenges or platform connection (e.g. linking your Twitch).
// Just storage for now; rendering is engine-side work later.

banners_unlocked = []  // list of banner ids the player owns

banner_unlock = [
    if (< (indexof $banners_unlocked $arg1) 0) [
        banners_unlocked = (concat $banners_unlocked $arg1)
        echo (format "[banner] unlocked: %1" $arg1)
    ]
]


// ---- PROGRESSION HOOKS -----------------------------------------------------
// Modes call these from their on_player_kill / on_player_death etc.

cosmetics_on_kill = [
    // arg1 = killer cn, arg2 = victim cn, arg3 = weapon_id
    // Stub: increment the per-weapon kill counter, fire any matching
    // challenge thresholds, persist.
    echo (format "[cosmetics-stub] %1 killed %2 with %3" $arg1 $arg2 $arg3)
]
