// Sumo — last-standing knockout on a small platform.
// First mode to validate the framework. Pattern other modes will copy.

registermode "sumo" "Sumo" "Knock opponents off the platform. Melee only. Last alive wins."

// Match state — server-side, reset each match
sumo_alive = []     // list of client numbers still alive

mode_init_sumo = [
    mode_resethooks
    sumo_alive = []

    // Wire lifecycle hooks for this mode
    alias on_match_start [
        sumo_alive = (getclientlist)
        echo (format "[sumo] match starting with %1 players" (listlen $sumo_alive))
    ]

    alias on_player_spawn [
        // arg1 = client number
        // Melee-only loadout — give the melee weapon, take everything else
        modehelper_setloadout $arg1 "melee"
    ]

    alias on_player_death [
        // arg1 = client number who died
        sumo_alive = (listdel $sumo_alive $arg1)
        echo (format "[sumo] %1 eliminated, %2 remaining" $arg1 (listlen $sumo_alive))

        // Win condition: last one standing
        if (= (listlen $sumo_alive) 1) [
            local winner = (at $sumo_alive 0)
            echo (format "[sumo] winner: client %1" $winner)
            modehelper_endmatch $winner
        ]
        if (= (listlen $sumo_alive) 0) [
            echo "[sumo] draw — no survivors"
            modehelper_endmatch -1
        ]
    ]

    // Kill volume — trigger script id 9000 (see MODES.md)
    // Map makers place a TRIGGER entity with attrs[0]=9000, attrs[1]=Script,
    // attrs[2]=Automatic. Entry into the volume fires this callback in the
    // context of the player who entered.
    alias on_trigger_9000 [
        echo (format "[sumo] client %1 fell into kill volume" $triggerclient)
        modehelper_kill $triggerclient
    ]
]
