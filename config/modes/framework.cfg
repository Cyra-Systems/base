// Game mode framework — Layer 1 (CubeScript wiring)
// See /MODES.md for architecture.
//
// This file defines the lifecycle hook dispatcher and the mode registry.
// Modes are .cfg files in this directory; each registers itself via
// `registermode` and hooks into the lifecycle by aliasing on_* callbacks.

mode_registry = []     // list of registered mode names
mode_current  = ""     // active mode (empty = stock RE behavior)

// Register a mode so it appears in lobby UI and can be selected.
// Usage:
//   registermode "sumo" "Sumo" "Knock players off the platform. Last alive wins."
registermode = [
    mode_registry = (concat $mode_registry $arg1)
    alias (concatword "mode_label_" $arg1) $arg2
    alias (concatword "mode_desc_" $arg1) $arg3
]

// Activate a mode by id. Calls on_match_start after switch.
setmode = [
    mode_current = $arg1
    if (>= (indexof $mode_registry $arg1) 0) [
        if (definedalias (concatword "mode_init_" $arg1)) [
            (concatword "mode_init_" $arg1)
        ]
        // Fire match-start callback (mode files alias this to their handler)
        if (definedalias "on_match_start") [ on_match_start ]
        echo (format "[mode] activated: %1" (getalias (concatword "mode_label_" $arg1)))
    ] [
        echo (format "[mode] unknown mode: %1" $arg1)
    ]
]

// Clear all on_* hooks. Called before switching modes so old handlers don't
// leak into the new mode. Each mode re-installs the hooks it cares about.
mode_resethooks = [
    alias on_match_start []
    alias on_match_end []
    alias on_player_spawn []
    alias on_player_kill []
    alias on_player_death []
    // Per-id trigger hooks are aliased by individual modes (on_trigger_<id>)
    // and reset by reloading their cfg.
]

// Stub helpers — these wrap engine commands that don't yet exist as
// CubeScript ICOMMANDs. Adding them is the next engine push.
//
// Each helper falls back to `echo` so framework can be tested without
// crashing while we wire up the real implementations.

modehelper_kill = [
    // arg1 = client number to kill
    // killclient is a real engine command added in src/game/game.cpp; it
    // applies fatal damage if cn is the local player. Remote-client kills
    // require server-side authority — TODO once mode logic moves server-side.
    killclient $arg1
]

modehelper_setloadout = [
    // arg1 = client number, arg2 = space-separated weapon list
    if (definedalias setclientloadout) [ setclientloadout $arg1 $arg2 ] [
        echo (format "[mode-stub] set loadout for %1 to '%2'" $arg1 $arg2)
    ]
]

modehelper_endmatch = [
    // arg1 = winning client (-1 for team / draw)
    if (definedalias endmatch) [ endmatch $arg1 ] [
        echo (format "[mode-stub] end match, winner=%1" $arg1)
    ]
]

// Convenience: list registered modes (for /modelist console command)
modelist = [
    echo "available modes:"
    loop i (listlen $mode_registry) [
        local name = (at $mode_registry $i)
        echo (format "  %1 — %2"
            (strpad $name 16)
            (getalias (concatword "mode_label_" $name))
        )
    ]
]
