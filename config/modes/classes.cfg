// Pick 10 class system — BO2 style.
// 10-point budget split across primary, secondary, lethal, tactical, perks,
// and wildcards. This file holds the data model + save/load. UI lives in
// config/ui/game/classes.cfg (built later) and the in-engine enforcement
// hooks (apply loadout at spawn) need server-side authority work.
//
// v0.5 milestone target — see /MODES.md roadmap. Pre-built here so modes
// that opt into LOADOUT_PICK10 have something to reference.

PICK10_BUDGET   = 10
PICK10_SLOTS    = 5     // saved class loadouts per player

// Item categories — every selectable item costs 1 point unless a wildcard
// modifies the rule (e.g. Overkill wildcard lets you take a second primary).
// item-id strings are free-form for now; the loadout applier maps them to
// in-engine weapons / perks / equipment at spawn.

PICK10_CATEGORIES = [
    "primary"     // 1 primary weapon
    "secondary"   // 1 secondary weapon
    "lethal"      // grenade / mine / claymore equivalent
    "tactical"    // flash / smoke / EMP equivalent
    "perk1"       // tier 1 perk
    "perk2"       // tier 2 perk
    "perk3"       // tier 3 perk
    "wildcard"    // up to 3 wildcards, each costs 1
]

// Wildcards — modify slot rules
PICK10_WILDCARDS = [
    "primary_gunfighter"   // 2 attachments on primary (when attachments exist)
    "overkill"             // 2 primary weapons (no secondary required)
    "perk1_greed"          // 2 tier-1 perks
    "perk2_greed"          // 2 tier-2 perks
    "perk3_greed"          // 2 tier-3 perks
    "tactician"            // 2 tactical equipment
    "danger_close"         // 2 lethal equipment
]

// A class loadout is stored as a flat list of "category:item-id" entries.
// Cost is implicit: 1 point per entry. Wildcards count as 1 entry each.
// Validation: total entries must equal PICK10_BUDGET, and item types must
// be valid for their category.
//
// Example:
//   class_slot_0 = [
//       "primary:smg"
//       "secondary:pistol"
//       "lethal:grenade"
//       "tactical:flashbang"
//       "perk1:lightweight"
//       "perk2:hardline"
//       "perk3:ninja"
//       "wildcard:overkill"
//       "primary:rifle"       // second primary, enabled by overkill
//       // 9 points used — 1 left unspent, valid (less common than maxing)
//   ]
//
// Storage uses CubeScript SVARs so they persist via the standard config
// save/load mechanism. Each player has PICK10_SLOTS class loadouts.

pick10_initslots = [
    loop i $PICK10_SLOTS [
        local svar = (concatword "class_slot_" $i)
        if (=s (getvar $svar) "") [
            setalias $svar []
        ]
    ]
]

pick10_initslots

// Validation — returns 1 if loadout is legal, 0 + an error string otherwise
pick10_validate = [
    // arg1 = loadout list
    local total = (listlen $arg1)
    if (> $total $PICK10_BUDGET) [
        echo (format "[pick10] over budget: %1 > %2" $total $PICK10_BUDGET)
        return 0
    ]
    // TODO: per-category caps (1 primary unless overkill, etc.)
    return 1
]

// Apply a saved slot to a player. Stubbed — needs the server-authoritative
// setclientloadout bridge to land first. Until then we wire only the data
// path so the UI work doesn't block.
pick10_apply = [
    // arg1 = cn, arg2 = slot index
    local slot = (getvar (concatword "class_slot_" $arg2))
    if (! (pick10_validate $slot)) [ return ]
    // Stub: real implementation iterates $slot, calls per-category setters
    echo (format "[pick10] would apply slot %1 to client %2: %3" $arg2 $arg1 $slot)
]

// Perks library — registered separately. Modes ask which perks are allowed
// when the loadout is applied. For v0.5 each perk is a stat modifier or
// event hook; visual-only "fluff" perks come later.
//
// perk_register <id> <tier> <label> <desc> <apply_cmd>

perks_registry = []   // list of "<id> <tier>"

perk_register = [
    perks_registry = (concat $perks_registry (concatword $arg1 " " $arg2))
    alias (concatword "perk_label_"   $arg1) $arg3
    alias (concatword "perk_desc_"    $arg1) $arg4
    alias (concatword "perk_apply_"   $arg1) $arg5
]

// Initial perk stubs — these will get real apply bodies once we have the
// per-player stat-override system. Listed here so the registry is non-empty
// and UI can render them.

perk_register "lightweight"  1 "Lightweight" "+10% movement speed."          [ echo "[perk-stub] lightweight" ]
perk_register "scavenger"    1 "Scavenger"   "Replenish ammo from kills."     [ echo "[perk-stub] scavenger" ]
perk_register "ghost"        1 "Ghost"       "Undetected by enemy UAVs."       [ echo "[perk-stub] ghost" ]

perk_register "hardline"     2 "Hardline"    "Killstreaks at -1 kill cost."    [ echo "[perk-stub] hardline" ]
perk_register "fastreload"   2 "Fast Hands"  "Faster reload and weapon swap."  [ echo "[perk-stub] fastreload" ]
perk_register "scout"        2 "Scout"       "Hold breath longer while ADS."   [ echo "[perk-stub] scout" ]

perk_register "ninja"        3 "Ninja"       "Silent footsteps."               [ echo "[perk-stub] ninja" ]
perk_register "extreme"      3 "Extreme Cond.""Sprint indefinitely."           [ echo "[perk-stub] extreme" ]
perk_register "dexterity"    3 "Dexterity"   "Faster ADS after sprinting."     [ echo "[perk-stub] dexterity" ]
