// Gun Game — kill cycles your weapon through the loadout list.
// First player to score a kill with the final weapon wins.
//
// Pattern: rotating loadout, no perks, kills are the primary signal.
// Compared to Sumo, this validates the kill->loadout-progression hook
// instead of just the death hook.

registermode "gungame" "Gun Game" "Cycle through every weapon. First to kill with the final wins."

// Weapon progression — easy first, harder last, melee final.
// Indices reference RE's weapon enum (see WEAP_* in src/game/weapons.h).
gungame_progression = [
    "pistol"
    "smg"
    "shotgun"
    "rifle"
    "plasma"
    "zapper"
    "flamer"
    "grenade"
    "rocket"
    "melee"   // final — must finish someone with melee to win
]

// Per-player progression — list keyed by client number (sparse, looked up
// linearly since player counts are small).
gungame_levels = []  // pairs: "<cn> <level>"

gungame_getlevel = [
    // arg1 = cn
    local prefix = (concatword $arg1 " ")
    loop i (listlen $gungame_levels) [
        local entry = (at $gungame_levels $i)
        if (=s (substr $entry 0 (strlen $prefix)) $prefix) [
            return (substr $entry (strlen $prefix))
        ]
    ]
    return 0
]

gungame_setlevel = [
    // arg1 = cn, arg2 = new level
    gungame_levels = (listdel $gungame_levels (concatword $arg1 " " (gungame_getlevel $arg1)))
    gungame_levels = (concat $gungame_levels (concatword $arg1 " " $arg2))
]

mode_init_gungame = [
    mode_resethooks
    gungame_levels = []

    alias on_match_start [
        echo "[gungame] match starting — everyone begins with the pistol"
        loop i (listlen (getclientlist)) [
            local cn = (at (getclientlist) $i)
            gungame_setlevel $cn 0
        ]
    ]

    alias on_player_spawn [
        // arg1 = cn — give them the weapon for their current level
        local level = (gungame_getlevel $arg1)
        local weap = (at $gungame_progression $level)
        modehelper_setloadout $arg1 $weap
        echo (format "[gungame] client %1 spawns at level %2 (%3)" $arg1 $level $weap)
    ]

    alias on_player_kill [
        // arg1 = killer cn, arg2 = victim cn
        // Advance killer's level; if they hit the end with the final weapon
        // (melee), they win.
        local level = (gungame_getlevel $arg1)
        local next  = (+ $level 1)
        if (>= $next (listlen $gungame_progression)) [
            echo (format "[gungame] client %1 wins!" $arg1)
            modehelper_endmatch $arg1
        ] [
            gungame_setlevel $arg1 $next
            local weap = (at $gungame_progression $next)
            modehelper_setloadout $arg1 $weap
            echo (format "[gungame] client %1 -> level %2 (%3)" $arg1 $next $weap)
        ]
    ]
]
