// Killstreaks / strike packages — MW3-style.
// MW3 introduced three strike packages: Assault (chain-streak, resets on
// death — classic CoD), Support (point-streak, no reset — earned over time),
// and Specialist (perks instead of rewards). This file holds the data model
// and registry. Per-mode policy decides whether killstreaks are enabled.
//
// v1.0 milestone target — the per-streak action bodies are stubs until
// vehicles + AI killstreaks (UAV, sentry) are implemented.

KILLSTREAK_PACKAGE_ASSAULT    = 0   // chain kills, resets on death
KILLSTREAK_PACKAGE_SUPPORT    = 1   // accumulate across deaths
KILLSTREAK_PACKAGE_SPECIALIST = 2   // earn perks instead of rewards

streaks_registry = []  // list of "<id> <package> <cost>"

streak_register = [
    // arg1 = id, arg2 = package, arg3 = cost (kills/points), arg4 = label,
    // arg5 = description, arg6 = apply_cmd (called when streak is earned)
    streaks_registry = (concat $streaks_registry (concatword $arg1 " " $arg2 " " $arg3))
    alias (concatword "streak_label_" $arg1) $arg4
    alias (concatword "streak_desc_"  $arg1) $arg5
    alias (concatword "streak_apply_" $arg1) $arg6
]

// Assault package — chain-kill streaks. Reset on death.
streak_register "uav"            $KILLSTREAK_PACKAGE_ASSAULT 3  \
    "UAV"            "Reveal enemy positions on the radar."      \
    [ echo "[streak-stub] UAV ping (needs radar overlay)" ]

streak_register "care_package"   $KILLSTREAK_PACKAGE_ASSAULT 4  \
    "Care Package"   "Drop a random crate with a weapon or streak." \
    [ echo "[streak-stub] care package drop (needs prop spawn)" ]

streak_register "predator"       $KILLSTREAK_PACKAGE_ASSAULT 5  \
    "Predator Missile" "Steerable explosive from above."         \
    [ echo "[streak-stub] predator missile (needs cinematic camera + steerable proj)" ]

streak_register "sentry"         $KILLSTREAK_PACKAGE_ASSAULT 6  \
    "Sentry Gun"     "Placeable auto-turret. Friendly to teammates." \
    [ echo "[streak-stub] sentry placement (needs AI turret)" ]

streak_register "attack_heli"    $KILLSTREAK_PACKAGE_ASSAULT 7  \
    "Attack Helicopter" "AI-controlled chopper patrols the map."  \
    [ echo "[streak-stub] attack heli (needs vehicle AI)" ]

streak_register "ac130"          $KILLSTREAK_PACKAGE_ASSAULT 12 \
    "AC-130"         "Pilot a gunship circling the map. 40s flight." \
    [ echo "[streak-stub] ac-130 (needs cinematic camera + projectile pipeline)" ]

// Support package — accumulate point streaks, no death reset
streak_register "uav_support"    $KILLSTREAK_PACKAGE_SUPPORT 4  \
    "UAV (Support)"  "Same as Assault UAV, persists through deaths." \
    [ echo "[streak-stub] UAV (support)" ]

streak_register "counter_uav"    $KILLSTREAK_PACKAGE_SUPPORT 5  \
    "Counter-UAV"    "Scramble enemy radars."                    \
    [ echo "[streak-stub] counter-UAV" ]

streak_register "ballistic_vest" $KILLSTREAK_PACKAGE_SUPPORT 7  \
    "Ballistic Vests" "Drop armor pickups for the team."         \
    [ echo "[streak-stub] vest drop (needs pickup spawner)" ]

streak_register "stealth_bomber" $KILLSTREAK_PACKAGE_SUPPORT 14 \
    "Stealth Bomber" "Carpet-bomb a line across the map."        \
    [ echo "[streak-stub] stealth bomber (needs flight path + bomb projectile)" ]

streak_register "emp"            $KILLSTREAK_PACKAGE_SUPPORT 18 \
    "EMP"            "Disable all enemy electronics for 60s."    \
    [ echo "[streak-stub] EMP (needs HUD scramble + streak disable)" ]

// Specialist package — earn perks instead of rewards.
// Player picks 3 perks at start of life; earning streaks unlocks them in
// order. At 8 kills, all perks unlocked (pro-perks bonus).
streak_register "specialist_perk1" $KILLSTREAK_PACKAGE_SPECIALIST 2 \
    "Specialist 2-kill"  "Unlock chosen tier-1 perk."             \
    [ echo "[streak-stub] specialist t1" ]

streak_register "specialist_perk2" $KILLSTREAK_PACKAGE_SPECIALIST 4 \
    "Specialist 4-kill"  "Unlock chosen tier-2 perk."             \
    [ echo "[streak-stub] specialist t2" ]

streak_register "specialist_perk3" $KILLSTREAK_PACKAGE_SPECIALIST 6 \
    "Specialist 6-kill"  "Unlock chosen tier-3 perk."             \
    [ echo "[streak-stub] specialist t3" ]

streak_register "specialist_pro"  $KILLSTREAK_PACKAGE_SPECIALIST 8 \
    "Specialist 8-kill"  "All perks active simultaneously."       \
    [ echo "[streak-stub] specialist pro" ]

// Per-player streak counter state. Server-authoritative when the bridge
// lands; client-side echo until then.
streak_counters = []  // "<cn> <chain> <total>"

streak_init_player = [
    streak_counters = (concat $streak_counters (concatword $arg1 " 0 0"))
]

streak_on_kill = [
    // arg1 = killer cn — called from mode on_player_kill hooks
    // Increments chain + total, checks for streak unlocks, applies them.
    // Stub for now — needs full per-player state machine.
    echo (format "[streak-stub] kill counted for client %1" $arg1)
]

streak_on_death = [
    // arg1 = dead cn — resets chain (assault package), preserves total (support)
    echo (format "[streak-stub] death resets chain for client %1" $arg1)
]
