// Infection — Halo-style asymmetric zombies.
// One player starts as an infected (melee only). They convert humans on
// kill. Last human alive wins; if all humans get infected, zombies win.
//
// Validates the team-flip pattern: kill flips victim's team allegiance.

registermode "infection" "Infection" "One zombie starts. Survive or convert humans on kill. Halo-style."

infection_humans = []
infection_zombies = []

infection_isalpha = 1  // flag: pick initial zombie at random

mode_init_infection = [
    mode_resethooks
    infection_humans = []
    infection_zombies = []
    infection_isalpha = 1

    alias on_match_start [
        local all = (getclientlist)
        if (< (listlen $all) 2) [
            echo "[infection] need at least 2 players, falling back to FFA"
            modehelper_endmatch -1
            return
        ]
        // Pick a random alpha zombie
        local alpha_idx = (rnd (listlen $all))
        local alpha = (at $all $alpha_idx)
        infection_zombies = (list $alpha)
        infection_humans  = (listdel $all $alpha)
        echo (format "[infection] alpha zombie: client %1 (%2 humans)" $alpha (listlen $infection_humans))
    ]

    alias on_player_spawn [
        // arg1 = cn — give appropriate loadout for their faction
        if (>= (indexof $infection_zombies $arg1) 0) [
            modehelper_setloadout $arg1 "melee"
            echo (format "[infection] zombie %1 spawned" $arg1)
        ] [
            modehelper_setloadout $arg1 "pistol smg shotgun"
            echo (format "[infection] human %1 spawned" $arg1)
        ]
    ]

    alias on_player_kill [
        // arg1 = killer cn, arg2 = victim cn
        // If a zombie killed a human, victim becomes zombie on respawn.
        if (>= (indexof $infection_zombies $arg1) 0) [
            if (>= (indexof $infection_humans $arg2) 0) [
                infection_humans  = (listdel $infection_humans $arg2)
                infection_zombies = (concat $infection_zombies $arg2)
                echo (format "[infection] client %1 infected, %2 humans remain" $arg2 (listlen $infection_humans))

                if (= (listlen $infection_humans) 0) [
                    echo "[infection] all humans infected — zombies win"
                    modehelper_endmatch -1
                ]
            ]
        ]
    ]

    alias on_player_death [
        // arg1 = cn — if a human died (not from zombie melee), they don't
        // become a zombie. on_player_kill handles the conversion case.
        // Nothing to do here in the standard rules.
    ]
]
