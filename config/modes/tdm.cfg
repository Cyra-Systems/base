// Team Deathmatch — generic mode that works on any map with team spawns.
// Pattern: no special map requirements, score per kill, first team to cap wins.
//
// Validates the "generic mode" approach: works on stock maps, doesn't need
// custom kill volumes or anchors. The opposite end of the spectrum from
// Sumo, which IS its map.

registermode "tdm" "Team Deathmatch" "First team to the score cap wins. Works on any map."

tdm_scorecap   = 75
tdm_timelimit  = 600    // seconds
tdm_team_score = []     // "<team> <score>"

tdm_getteamscore = [
    local prefix = (concatword $arg1 " ")
    loop i (listlen $tdm_team_score) [
        local entry = (at $tdm_team_score $i)
        if (=s (substr $entry 0 (strlen $prefix)) $prefix) [
            return (substr $entry (strlen $prefix))
        ]
    ]
    return 0
]

tdm_addteamscore = [
    // arg1 = team, arg2 = delta
    local cur = (tdm_getteamscore $arg1)
    local new = (+ $cur $arg2)
    tdm_team_score = (listdel $tdm_team_score (concatword $arg1 " " $cur))
    tdm_team_score = (concat $tdm_team_score (concatword $arg1 " " $new))
    if (>= $new $tdm_scorecap) [
        echo (format "[tdm] team %1 wins (%2 / %3)" $arg1 $new $tdm_scorecap)
        modehelper_endmatch -1
    ]
]

mode_init_tdm = [
    mode_resethooks
    tdm_team_score = []

    alias on_match_start [
        echo (format "[tdm] starting — first to %1 or time %2s" $tdm_scorecap $tdm_timelimit)
    ]

    alias on_player_spawn [
        // arg1 = cn — give a standard loadout. Pick 10 takes over if
        // policy=LOADOUT_PICK10 in a future map.
        modehelper_setloadout $arg1 "smg pistol grenade"
    ]

    alias on_player_kill [
        // arg1 = killer cn, arg2 = victim cn
        // TDM credits kill to killer's team. Team lookup needs an engine
        // bridge (getclientteam) we'll add. For now stub by always crediting
        // team "red" so the win-condition still fires for testing.
        tdm_addteamscore "red" 1
        cosmetics_on_kill $arg1 $arg2 0
        streak_on_kill $arg1
    ]

    alias on_player_death [
        streak_on_death $arg1
    ]
]
