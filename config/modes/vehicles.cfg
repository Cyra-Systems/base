// Vehicles — Halo Reach-style arcade physics.
// Players can enter/exit, drive, and shoot. Multi-seat (driver, gunner,
// passenger) for the larger vehicles. NOT GTA-style simulation — these
// are rigid bodies with input forces, like Reach's Warthog and Ghost.
//
// v1.0+ milestone. The actual vehicle physics + entity type is engine
// work — this file is the data model + registry only.

VEHICLE_SEAT_DRIVER     = 0
VEHICLE_SEAT_GUNNER     = 1
VEHICLE_SEAT_PASSENGER  = 2

vehicles_registry = []  // list of vehicle ids

vehicle_register = [
    // arg1 = id, arg2 = label, arg3 = seats (count),
    // arg4 = max_speed, arg5 = acceleration, arg6 = turning_radius,
    // arg7 = health, arg8 = primary_weapon (gunner seat), arg9 = description
    vehicles_registry = (concat $vehicles_registry $arg1)
    alias (concatword "vehicle_label_"   $arg1) $arg2
    alias (concatword "vehicle_seats_"   $arg1) $arg3
    alias (concatword "vehicle_speed_"   $arg1) $arg4
    alias (concatword "vehicle_accel_"   $arg1) $arg5
    alias (concatword "vehicle_turn_"    $arg1) $arg6
    alias (concatword "vehicle_hp_"      $arg1) $arg7
    alias (concatword "vehicle_weapon_"  $arg1) $arg8
    alias (concatword "vehicle_desc_"    $arg1) $arg9
]

// Halo Reach vehicle roster — values approximate the feel from Reach
// scaled to RE's world units. Tuning happens once the entity type exists.

vehicle_register "mongoose" "Mongoose"  2  150  20  3   300   "none"        \
    "Two-seat ATV. Fast, fragile, no mounted weapon."

vehicle_register "warthog"  "Warthog"   3  130  18  5   1200  "chaingun"    \
    "Three-seat: driver, gunner with chaingun, passenger."

vehicle_register "ghost"    "Ghost"     1  140  25  4   600   "plasma_dual" \
    "Single-seat hover. Twin plasma cannons. Boost on tap."

vehicle_register "banshee"  "Banshee"   1  180  15  6   800   "plasma_bomb" \
    "Single-seat flyer. Plasma cannon + fuel rod alt-fire."

vehicle_register "falcon"   "Falcon"    3  120  10  8   1500  "chaingun_dual" \
    "Three-seat chopper. Pilot + two side gunners. Hover handling."

vehicle_register "wraith"   "Wraith"    2  90   8   12  3000  "plasma_mortar" \
    "Two-seat hover tank. Boost forward thrust. Mortar fires arcing plasma."

vehicle_register "revenant" "Revenant"  2  130  20  6   900   "plasma_mortar_light" \
    "Two-seat hover speeder. Fast mortar attack. Glass cannon."

// Spawn helpers — modes / map editor call these to drop a vehicle at a
// position. Stubbed until the vehicle entity type exists.

vehicle_spawn = [
    // arg1 = vehicle id, arg2 = x, arg3 = y, arg4 = z, arg5 = yaw
    if (< (indexof $vehicles_registry $arg1) 0) [
        echo (format "[vehicle] unknown id: %1" $arg1)
        return
    ]
    echo (format "[vehicle-stub] spawn %1 at (%2 %3 %4) yaw %5 — needs engine entity type" \
        $arg1 $arg2 $arg3 $arg4 $arg5)
]

vehicle_remove = [
    // arg1 = vehicle entity id
    echo (format "[vehicle-stub] remove %1" $arg1)
]

// Per-mode policy: modes opt into vehicles by setting allow_vehicles in
// their rule flags. When set, the mode's map should contain vehicle_spawn
// calls in its anchor or have vehicle entity placements.

vehicles_for_mode = [
    // arg1 = mode id
    // Returns the vehicle set this mode permits. Modes can also veto
    // specific vehicles by overriding this.
    case $arg1 \
        "tdm"     [ list "mongoose" "warthog" "ghost" ] \
        "br"      [ list "mongoose" "warthog" "ghost" "banshee" "falcon" ] \
        "zombies" [ list ] \
        "sumo"    [ list ] \
        [ list ]
]
