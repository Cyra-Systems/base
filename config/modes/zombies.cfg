// Zombies — round-based survival, Treyarch pattern.
// Players co-op vs waves of AI. Points earned per damage/kill, spent at
// vending machines (perks, weapon upgrades, mystery box). Round number
// scales enemy count + HP.
//
// v2.0 milestone. Needs AI infrastructure (zombie pathing, attack behavior),
// vending machine entity type, weapon upgrade ("pack-a-punch") system,
// and the perk-machine mechanic. All stubbed here so the mode FILE exists
// even though it can't yet RUN.

registermode "zombies" "Zombies" "Co-op survival vs waves. Points buy weapons and perks."

zombies_round       = 0
zombies_alive_count = 0      // zombies still alive in current round
zombies_round_size  = [
    // Round N spawns this many zombies. Treyarch curve approx:
    // round 1 = 6, round 2 = 8, +2 per round until round 9, then +N*0.15
    6   8  10  12  14  16  18  20  22  // rounds 1-9
    24  27  30  33  36  39  42         // 10-16
    // ... continues, scales by ~15% per round after that
]

zombies_perk_machines = [
    // Treyarch's classic perks. Each costs 2500 points to drink at the
    // corresponding machine. Map editor places vending entities with
    // attrs[0]=9100 + perk_index.
    "juggernog"      // 2000 HP -> 5000 HP
    "speed_cola"     // 50% faster reload
    "double_tap"     // double fire rate
    "quick_revive"   // self-revive in solo, faster ally revive in co-op
    "stamin_up"      // faster sprint
    "deadshot"       // headshot magnet on aim
    "phd_flopper"    // immune to fall + explosive damage
    "mule_kick"      // +1 weapon slot
]

zombies_weapons_pap = [
    // Pack-a-punch upgraded versions of weapons. Cost: 5000 points.
    // Maps to existing weapon + buff (damage, ammo, mag size).
    "pistol_pap"     // pistol -> mustang & sally (akimbo magnum w/ explosive rounds)
    "smg_pap"        // smg -> upgraded smg with attached scope
    "shotgun_pap"    // shotgun -> "the executioner" / spas-12 reborn
    "rifle_pap"      // rifle -> upgraded sniper
    // ... etc per weapon
]

mode_init_zombies = [
    mode_resethooks
    zombies_round = 0
    zombies_alive_count = 0

    alias on_match_start [
        echo "[zombies] starting — round 1 begins after spawn"
        zombies_start_round 1
    ]

    alias on_player_spawn [
        modehelper_setloadout $arg1 "pistol"
        echo (format "[zombies] player %1 enters the trenches" $arg1)
    ]

    alias on_player_kill [
        // arg1 = killer cn, arg2 = victim cn — only zombie deaths count
        // here; ally TKs are filtered server-side.
        zombies_award_points $arg1 100
        zombies_alive_count = (- $zombies_alive_count 1)
        if (<= $zombies_alive_count 0) [
            zombies_round = (+ $zombies_round 1)
            zombies_start_round $zombies_round
        ]
    ]

    alias on_player_death [
        // Single-player downs are revivable for 30s. In co-op an ally has
        // to revive before bleed-out. Stubbed — needs the down/revive state.
        echo (format "[zombies-stub] client %1 down (needs revive system)" $arg1)
    ]
]

zombies_start_round = [
    // arg1 = round number
    local count = (at $zombies_round_size (- $arg1 1))
    if (=s $count "") [ count = (* $arg1 4) ]   // rough fallback for later rounds
    zombies_alive_count = $count
    echo (format "[zombies-stub] round %1 — spawning %2 zombies (needs AI spawner)" $arg1 $count)
    // TODO: actual zombie spawn — needs server-side AI controller + a
    // zombie actor type derived from RE's existing bot infrastructure.
]

zombies_award_points = [
    // arg1 = cn, arg2 = amount — Treyarch awards 10 per damage tick + 90
    // on the killing blow. Stubbed here as flat 100 per kill.
    echo (format "[zombies-stub] client %1 +%2 points" $arg1 $arg2)
]
