// Campaign — scripted single-player / co-op missions.
// Each campaign mission is a custom map with embedded objectives, scripted
// AI encounters, optional dialogue, and a linear or branching progression.
//
// v3.0 milestone. The framework here is the "mission" pattern — modes
// like CTF / Defend / Escort all use the same objective sequencing
// primitives, so this code doubles as the foundation for any
// objective-driven multiplayer mode.

registermode "campaign" "Campaign" "Story missions. Solo or co-op."

// A mission script is a sequence of "objectives". Each objective declares:
//   - a trigger that completes it (kill_target, reach_zone, hold_zone,
//     defend_object, custom_script)
//   - a label shown on HUD
//   - an optional dialogue cue fired on start / complete
//
// Missions are .cfg files in config/modes/campaigns/, exec'd by name.

campaign_current_mission = ""
campaign_objectives = []      // list of "<id> <type> <param> <label>"
campaign_objective_index = 0

OBJ_KILL_TARGET    = "kill_target"     // param = target entity id or actor name
OBJ_REACH_ZONE     = "reach_zone"      // param = trigger script id
OBJ_HOLD_ZONE      = "hold_zone"       // param = trigger script id, duration seconds
OBJ_DEFEND         = "defend"          // param = entity id, hp threshold
OBJ_ESCORT         = "escort"          // param = entity id, destination zone
OBJ_INTERACT       = "interact"        // param = entity id (use key)
OBJ_CUSTOM         = "custom"          // param = CubeScript callback id

campaign_objective = [
    // Called from a mission script during init. Builds the objective list.
    // arg1 = id, arg2 = type, arg3 = param, arg4 = label
    campaign_objectives = (concat $campaign_objectives (concatword $arg1 " " $arg2 " " $arg3 " " $arg4))
]

mode_init_campaign = [
    mode_resethooks
    campaign_current_mission = ""
    campaign_objectives = []
    campaign_objective_index = 0

    alias on_match_start [
        if (=s $campaign_current_mission "") [
            echo "[campaign] no mission loaded — set campaign_current_mission first"
            modehelper_endmatch -1
            return
        ]
        echo (format "[campaign] loading mission: %1" $campaign_current_mission)
        // Exec the mission script — it calls campaign_objective <...> repeatedly
        exec (format "config/modes/campaigns/%1.cfg" $campaign_current_mission)
        campaign_start_next_objective
    ]

    alias on_player_spawn [
        modehelper_setloadout $arg1 "pistol smg grenade"
    ]

    alias on_player_death [
        // Campaign is mostly checkpoint-based; death reloads last checkpoint.
        echo (format "[campaign-stub] player %1 died — reload last checkpoint" $arg1)
    ]
]

campaign_start_next_objective = [
    if (>= $campaign_objective_index (listlen $campaign_objectives)) [
        echo "[campaign] all objectives complete — mission won"
        modehelper_endmatch -1
        return
    ]
    local obj = (at $campaign_objectives $campaign_objective_index)
    echo (format "[campaign] objective %1: %2" $campaign_objective_index $obj)
    // TODO: wire up real objective hooks per type. Reach-zone uses an
    // existing trigger callback; kill-target needs an AI death hook;
    // defend / escort need new bridges.
]

campaign_complete_objective = [
    campaign_objective_index = (+ $campaign_objective_index 1)
    echo "[campaign] objective complete"
    campaign_start_next_objective
]
