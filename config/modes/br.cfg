// Battle Royale — shrinking zone, loot-driven, large map, last one standing.
// Apex / Warzone / Fortnite pattern. Scaled-down for ~16-32 players given
// RE's networking and engine ceiling.
//
// v3.0 milestone. Needs: large-map support, loot table + ground pickups
// (RE has pickups but BR needs hundreds), shrinking zone damage volume,
// drop-pod spawn, parachute / dive intro, late-game vehicles optional.

registermode "battleroyale" "Battle Royale" "Looting, shrinking zone, last alive wins. Scaled for 16-32 players."

br_zone_radius_init = 200       // world units — depends on map scale
br_zone_radius_min  = 8
br_zone_phases      = 8         // shrink stages
br_phase_duration   = 90        // seconds per phase
br_zone_damage      = [
    // Per-phase tick damage when outside the safe zone. Escalates.
    1  2  5  10  20  35  60  100
]

br_alive = []
br_current_phase = 0
br_zone_center = [0 0 0]

mode_init_br = [
    mode_resethooks
    br_alive = []
    br_current_phase = 0

    alias on_match_start [
        br_alive = (getclientlist)
        if (< (listlen $br_alive) 4) [
            echo "[br] need at least 4 players, aborting"
            modehelper_endmatch -1
            return
        ]
        echo (format "[br] starting with %1 players, %2 phases" (listlen $br_alive) $br_zone_phases)
        br_advance_phase
    ]

    alias on_player_spawn [
        // BR spawns are one-shot at match start (drop pods / parachutes).
        // No respawns — when you die you're out. Loadout is empty; players
        // loot ground spawns for weapons.
        modehelper_setloadout $arg1 ""
        echo (format "[br] player %1 dropped into the AO" $arg1)
    ]

    alias on_player_kill [
        // arg1 = killer, arg2 = victim — no respawn, victim is eliminated
    ]

    alias on_player_death [
        br_alive = (listdel $br_alive $arg1)
        echo (format "[br] client %1 eliminated, %2 remain" $arg1 (listlen $br_alive))
        if (= (listlen $br_alive) 1) [
            local winner = (at $br_alive 0)
            echo (format "[br] winner: client %1" $winner)
            modehelper_endmatch $winner
        ]
    ]
]

br_advance_phase = [
    br_current_phase = (+ $br_current_phase 1)
    if (> $br_current_phase $br_zone_phases) [
        // Final phase — zone is at minimum radius, fight to the finish
        echo "[br] final zone reached"
        return
    ]
    local radius = (br_radius_at_phase $br_current_phase)
    echo (format "[br] phase %1 — zone shrinks to radius %2" $br_current_phase $radius)
    // TODO: trigger visual + damage volume update — needs engine bridge for
    // a "zone" entity type that wraps a sphere/cylinder collider with
    // periodic damage to players outside it.
]

br_radius_at_phase = [
    // Linear interpolation between init and min, can be eased later
    local t = (divf (* 1.0 $arg1) $br_zone_phases)
    return (+ $br_zone_radius_init (* (- $br_zone_radius_min $br_zone_radius_init) $t))
]

// Loot tables — what spawns at ground pickups. Quality tiers gate by rarity.
br_loot_common = [
    "pistol" "smg" "shotgun" "ammo_small" "health_small" "armor_light"
]
br_loot_uncommon = [
    "rifle" "plasma" "ammo_medium" "health_medium" "armor_medium" "grenade"
]
br_loot_rare = [
    "minigun" "rocket" "armor_heavy" "killstreak_uav"
]
br_loot_legendary = [
    "eclipse" "killstreak_predator" "self_revive"
]
