name: Build Windows Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install mingw-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 mingw-w64-tools mingw-w64-common make zip
          # Locate winresrc.h shipped by the mingw-w64-x86-64-dev package
          # and capture its directory so we can hand it to windres.
          WINRES_H=$(dpkg -L mingw-w64-x86-64-dev mingw-w64-common 2>/dev/null | grep -m1 '/winresrc\.h$' || true)
          if [ -z "$WINRES_H" ]; then
            WINRES_H=$(find /usr -name winresrc.h 2>/dev/null | head -1)
          fi
          echo "winresrc.h is at: $WINRES_H"
          test -n "$WINRES_H"
          WINRES_DIR=$(dirname "$WINRES_H")
          # Wrap windres so the Makefile's bare invocation runs the
          # cross resource compiler and gets an explicit include path.
          printf '#!/bin/sh\nexec /usr/bin/x86_64-w64-mingw32-windres --include-dir=%s "$@"\n' "$WINRES_DIR" \
            | sudo tee /usr/local/bin/windres >/dev/null
          sudo chmod +x /usr/local/bin/windres
          echo "--- /usr/local/bin/windres ---"
          cat /usr/local/bin/windres
          echo "--- which windres ---"
          which windres
          echo "--- smoke test ---"
          windres --version | head -1

      - name: Cross-compile Windows binaries
        working-directory: src
        run: |
          make -j"$(nproc)" install \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++ \
            AR=x86_64-w64-mingw32-ar \
            RANLIB=x86_64-w64-mingw32-ranlib

      - name: Verify binary
        run: |
          ls -la bin/amd64/redeclipse.exe
          file bin/amd64/redeclipse.exe

      - name: Stage release tree
        run: |
          mkdir -p release/redeclipse
          cp -r bin config data doc readme.md readme.txt \
                redeclipse.bat redeclipse.sh \
                redeclipse_server.bat redeclipse_server.sh \
                release/redeclipse/
          # Strip dev cruft
          find release/redeclipse -type d -name .git -prune -exec rm -rf {} +
          find release/redeclipse -type f -name '.gitignore' -delete
          find release/redeclipse -type f -name '.gitmodules' -delete

      - name: Archive release (split into 1.9 GiB volumes)
        working-directory: release
        run: |
          sudo apt-get install -y p7zip-full
          # -mx=1 = fast compression (data is mostly already-compressed media)
          # -v1900m = split into 1.9 GiB volumes to stay under GitHub's 2 GiB
          #          per-release-asset limit. Produces .7z.001, .7z.002, ...
          7z a -mx=1 -v1900m ../redeclipse-windows.7z redeclipse
          cd ..
          ls -lh redeclipse-windows.7z*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: redeclipse-windows
          path: redeclipse-windows.7z*
          if-no-files-found: error

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.ref_name }}
          name: "Build (${{ github.ref_name }})"
          body: |
            Automated Windows build from `${{ github.ref_name }}` @ ${{ github.sha }}.

            **How to install:**
            1. Download every `redeclipse-windows.7z.0XX` file below into the same folder.
            2. Right-click `redeclipse-windows.7z.001` → 7-Zip → Extract here.
               (Install 7-Zip from https://www.7-zip.org/ if you don't have it.)
            3. Open the extracted `redeclipse` folder and double-click `redeclipse.bat`.
          files: redeclipse-windows.7z*
          prerelease: true
